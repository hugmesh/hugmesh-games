# HugMesh Games — LAN-access configuration.
#
# This file is a docker-compose env-file. Two equivalent ways to take it:
#
#   • `make lan-up`                                    (recommended)
#   • `docker compose --env-file lan.properties up -d` (plain compose)
#
# `make lan-up-tls` and `make lan-up-http-tls` add HTTPS on top — see
# `docker-compose.tls.yml` and the Makefile lan-* recipes.
#
# A plain `docker compose up -d` with NO env-file falls back to the
# defaults baked into `docker-compose.yml` (127.0.0.1 loopback, port
# 8080) — so a fresh clone never accidentally exposes the BFF or
# Postgres to the local network.
#
# Switch FRONTEND_BIND between:
#   127.0.0.1:    loopback only (laptop-only access)
#   0.0.0.0:      all interfaces (phones / tablets / LAN peers can reach
#                 the portal at http://<this-host-ip>:<FRONTEND_PORT>/)
#   192.168.x.y:  pin to a single interface (rarely needed; useful when
#                 the host has multiple NICs and you only want one)
#
# The trailing `:` matters — docker compose splices it into the port
# mapping as `${BIND}${PORT}:${CONTAINER_PORT}`.

# Bind the portal to all interfaces (so LAN peers can reach it).
# Flip back to `127.0.0.1:` to keep the portal loopback-only.
FRONTEND_BIND=0.0.0.0:

# Host port the portal answers on (container internal port stays 8080).
FRONTEND_PORT=8080

# Postgres almost never wants LAN exposure. Leave at loopback unless
# you're running a DB GUI from another machine on the same network.
POSTGRES_BIND=127.0.0.1:

# Optional: enable HTTPS via `make lan-up-tls`. The cert is self-signed
# (from `make gen-certs`) so browsers will prompt the first time.
# This file's only job is to set the host-side bind + port — the TLS
# layer comes from the docker-compose.tls.yml overlay.
