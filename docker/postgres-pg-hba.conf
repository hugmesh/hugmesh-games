# pg_hba.conf — mounted into the PRIMARY when the postgres-replica
# overlay is active. Adds a host-replication rule for the
# `replicator` role over the docker network's subnet so the
# postgres-replica container can run pg_basebackup + maintain the
# streaming connection. The default rules (trust local socket,
# md5 for everything else) are preserved.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    replication     replicator      172.16.0.0/12           md5
host    replication     replicator      10.0.0.0/8              md5
host    all             all             0.0.0.0/0               md5
host    all             all             ::/0                    md5
