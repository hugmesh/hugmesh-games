# Release: build and push the five hugmesh-games images to GHCR.
#
# This is the GitHub counterpart of build:image in .gitlab-ci.yml, and it keeps
# that job's gate: no image is built until the same four unit-test legs are green
# (backend, frontend, games-js, rust-cores; the commands are copied from the
# GitLab test stage, so a green run here and a green `make test` mean the same).
#
# Images (one version for all five, from the VERSION file):
#   ghcr.io/hugmesh/hugmesh-games/{backend,frontend,rpg-builder,vn-builder,wasm-fragment}
#
# hugmesh-release-channels: beta+stable
# The release channel comes from the TAG. scripts/release-channel.sh decides
# every case below, for each of the five images, and is tested by
# scripts/test-release-channel.sh (the version job runs it first):
#
#   push to main                   -> :main and :sha-<12>        (no release)
#   push to release/X.Y            -> :sha-<12> only (the same main-style run the
#                                     release script checks before it tags; VERSION
#                                     must be X.Y.*)
#   push of tag vX.Y.Z-beta.N      -> :X.Y.Z-beta.N, :beta and :sha-<12>, then a
#                                     GitHub prerelease that is never marked Latest.
#                                     The commit must be on main.
#   push of tag vX.Y.Z (stable)    -> :X.Y.Z, :X.Y, :latest and :sha-<12>, then a
#                                     GitHub release marked Latest. The commit must
#                                     be on release/X.Y. A patch on an older line (a
#                                     newer stable vA.B.C is published) moves :X.Y
#                                     but not :latest, and its GitHub release is not
#                                     marked Latest.
#   workflow_dispatch on main, a release/X.Y branch or a v* tag
#                                  -> same as the push; for a tag, an image whose
#                                     :X.Y.Z already exists is left alone (the
#                                     re-run path for a run that published only
#                                     some of the five images), and so is an
#                                     existing GitHub release
#   anything else                  -> refused by the version job (this includes
#                                     release/<anything that is not X.Y>)
#
# :X.Y.Z is never overwritten (a tag push fails if it exists); the floating tags
# :beta, :X.Y and :latest move. Every tag a run pushes for an image points at one
# digest, and that digest is signed and attested. Bump VERSION with
# `make check-version` green, merge, then tag.
#
# The version job only refuses early. "Re-run failed jobs" reuses its outputs,
# however old they are, and a newer stable can publish while a run is in its
# test jobs, so whether :X.Y and :latest move is decided again by the same
# script right before each image's push and right before gh release create. No
# later job reads the version job's answer, so a re-run cannot move a floating
# tag to an older line. A window of seconds remains between that check and the
# registry write (a registry has no compare-and-swap); if a concurrent run wins
# it, the digest check below fails that run.
#
# Runner: every job except the image job uses the line below. It picks the
# self-hosted runner only when the repo variable RUNS_ON_PUBLISH is set (a JSON
# array such as ["self-hosted","Linux","X64"]) AND the run is a push/dispatch on
# main or a v* tag. Everything else, including an unset variable and every
# release/X.Y branch run, runs on hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH
# is the off switch. This workflow has no pull_request trigger, and must never
# get one.
name: Release

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/hugmesh/hugmesh-games

jobs:
  version:
    name: Version guard
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      channel: ${{ steps.v.outputs.channel }}
      line: ${{ steps.v.outputs.line }}
      sha: ${{ steps.sha.outputs.sha }}
      sha12: ${{ steps.sha.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard self-test
        run: python3 -m unittest scripts/test_check_version.py

      - name: Self-test the release channel rules
        run: bash scripts/test-release-channel.sh

      # No credential literal or literal default in the compose files the
      # prod/staging overlays extend (hugmesh-games#57). The self-test first,
      # so a guard that can no longer fail is itself a failure.
      - name: Self-test the compose credential guard
        run: bash scripts/test-check-compose-credential-defaults.sh

      - name: No credential literal on the prod/staging compose path
        run: bash scripts/check-compose-credential-defaults.sh

      # The pentest compose profile bypasses the Makefile gates: it must
      # resolve every required variable of the compose files it runs.
      - name: Pentest compose profile resolves every required variable
        run: bash scripts/test-compose-env-interpolation.sh

      # The SCA wrapper keeps the NVD API key off argv and refuses an
      # empty/missing/malformed one (fake Dependency-Check, fake keys).
      - name: SCA wrapper NVD API key handling
        run: bash tests/pentest/test-run-sca-nvd-key.sh

      - name: Check VERSION against every version file and the ref
        id: guard
        run: python3 scripts/check_version.py --ref "$GITHUB_REF"

      # Channel, branch rules and image tags: scripts/release-channel.sh. A tag
      # vX.Y.Z-beta.N must be on main, a stable vX.Y.Z on release/X.Y. Its
      # floating-tag answer is not used by any later job (they decide again);
      # backend stands in for the five images here.
      - name: Decide the release channel
        id: v
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          out="$(IMAGE_NAME="$IMAGE_PREFIX/backend" VERSION_FILE=VERSION bash scripts/release-channel.sh)"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"
          echo "$out"

      - name: Record the commit
        id: sha
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sha12=${sha:0:12}" >> "$GITHUB_OUTPUT"

  # ── The GitLab test stage, unchanged in substance ───────────────────────────
  # Each leg runs in a disposable container as the runner's own uid, exactly as
  # in .gitlab-ci.yml (see the long comments there for why each flag exists).
  test-backend:
    name: Test backend
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache the Maven repository and wrapper
        uses: actions/cache@v4
        with:
          path: |
            .ci-home/.m2/repository
            .ci-home/.m2/wrapper
          key: games-maven-${{ hashFiles('backend/pom.xml', 'backend/.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: games-maven-

      - name: Backend unit tests (Testcontainers needs the docker socket)
        run: |
          mkdir -p .ci-home
          docker run --rm --network=host \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c %g /var/run/docker.sock)" \
            -e HOME=/workspace/.ci-home \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/backend \
            eclipse-temurin:25-jdk \
            ./mvnw -B test

  test-frontend:
    name: Test frontend
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Angular unit tests (Karma, Chromium baked into the test image)
        run: |
          docker build -q -f frontend/Dockerfile.test -t hugmesh-games-frontend-test frontend
          docker run --rm --init --shm-size=1gb \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/.npm \
            -v "${GITHUB_WORKSPACE}/frontend:/work" \
            -w /work \
            hugmesh-games-frontend-test \
            sh -c 'npm ci --no-audit --no-fund && npm test'

  test-games-js:
    name: Test games JS
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Plain-node game suites
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            node:22-alpine \
            sh -c 'set -e; for t in games/_shared/test/*.test.mjs; do echo "→ node $t"; node "$t"; done'

  test-rust-cores:
    name: Test Rust game cores
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pure-Rust cores, offline (the mount must be writable for Cargo.lock)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e CARGO_HOME=/tmp/cargo \
            -e CARGO_TARGET_DIR=/tmp/cargo-target \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            rust:1-slim \
            sh -c 'set -e; for d in extensions/hugmesh-*/; do case "$d" in */hugmesh-bridge/) continue;; esac; echo "→ cargo test in $d"; ( cd "$d" && cargo test --offline --quiet ); done'

  # ── Images ──────────────────────────────────────────────────────────────────
  image:
    name: Image ${{ matrix.component }}
    needs: [version, test-backend, test-frontend, test-games-js, test-rust-cores]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    strategy:
      fail-fast: false
      matrix:
        # Same matrix as build:image in .gitlab-ci.yml. wasm-fragment's
        # Dockerfile copies from backend/ and wasm-fragment/, so it needs the
        # repo root as its context. rpg-builder and vn-builder fetch the Godot
        # toolchain at build time; the optional repo variable
        # GODOT_MIRROR_BASE_URL redirects that fetch (unset = GitHub releases).
        include:
          - { component: backend,       context: backend,       dockerfile: backend/Dockerfile,       godot: false }
          - { component: frontend,      context: frontend,      dockerfile: frontend/Dockerfile,      godot: false }
          - { component: rpg-builder,   context: rpg-builder,   dockerfile: rpg-builder/Dockerfile,   godot: true }
          - { component: vn-builder,    context: vn-builder,    dockerfile: vn-builder/Dockerfile,    godot: true }
          - { component: wasm-fragment, context: .,             dockerfile: wasm-fragment/Dockerfile, godot: false }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable :X.Y.Z (or :X.Y.Z-beta.N) is checked here. The
      # floating tags :beta, :X.Y and :latest are meant to move to a newer
      # release, so they are not.
      - name: Refuse to overwrite a published version
        id: exists
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
        run: |
          set -euo pipefail
          if [ "$KIND" != release ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$IMAGE_NAME:$VERSION"
          # Exit 0 means the tag exists. GHCR answers "not found" or
          # "denied" for a package or tag that does not exist yet; any
          # other failure is unexplained, so stop rather than guess.
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::notice::$ref is already published; it is not rebuilt or overwritten"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$VERSION" in
              *-*) next="bump VERSION (raise the beta number) and tag again" ;;
              *) next="cut the next patch release from release/${VERSION%.*}" ;;
            esac
            echo "::error::$ref already exists. A published version is never overwritten: $next."
            exit 1
          fi
          case "$out" in
            *"not found"*|*NOT_FOUND*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*denied*|*unauthorized*) ;;
            *) echo "::error::cannot tell whether $ref exists: $out"; exit 1 ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # rpg-builder and vn-builder fetch the Godot toolchain at build time; the
      # optional repo variable GODOT_MIRROR_BASE_URL redirects that fetch.
      - name: Compute the build arguments
        id: args
        if: steps.exists.outputs.skip != 'true'
        env:
          GODOT: ${{ matrix.godot }}
          GODOT_MIRROR: ${{ vars.GODOT_MIRROR_BASE_URL }}
        run: |
          set -euo pipefail
          build_args=""
          if [ "$GODOT" = true ] && [ -n "${GODOT_MIRROR:-}" ]; then
            build_args="GODOT_RELEASE_BASE_URL=$GODOT_MIRROR"
          fi
          echo "build_args=$build_args" >> "$GITHUB_OUTPUT"

      # Builds now and pushes nothing, so the step that pushes finds every layer
      # in the builder's cache and takes seconds. The tag check below would
      # otherwise be as old as the whole build by the time the tags are written.
      - name: Build the image (no push)
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          pull: true
          push: false
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Compute tags and labels
        id: meta
        if: steps.exists.outputs.skip != 'true'
        env:
          IMAGE_NAME: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}
        run: |
          set -euo pipefail
          # scripts/release-channel.sh decides this image's tag list here, right
          # before the push, not in the version job: beta -> :X.Y.Z-beta.N + :beta;
          # stable -> :X.Y.Z plus :X.Y and :latest when nothing newer is
          # published on its line / on any line; every run adds :sha-<12>.
          out="$(VERSION_FILE=VERSION bash scripts/release-channel.sh)"
          echo "$out"
          tags="$(printf '%s\n' "$out" | sed -n '/^image_tags<<EOF_IMAGE_TAGS$/,/^EOF_IMAGE_TAGS$/p' | sed '1d;$d')"
          move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
          if [ -z "$tags" ]; then
            echo "::error::scripts/release-channel.sh computed no image tags"
            exit 1
          fi
          while IFS= read -r t; do
            case "$t" in
              "$IMAGE_NAME":?*) ;;
              *) echo "::error::unexpected image tag '$t'"; exit 1 ;;
            esac
          done <<< "$tags"
          if [ "$KIND" = release ]; then
            label_version="$VERSION"
          else
            label_version="$GITHUB_REF_NAME"
          fi
          {
            echo "move_latest=$move_latest"
            echo "label_version=$label_version"
            echo "tags<<EOF_TAGS"
            echo "$tags"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags:"
          echo "$tags"

      - name: Build and push
        id: build
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.args.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.label_version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}
            org.opencontainers.image.title=hugmesh-games/${{ matrix.component }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_TAGS: ${{ steps.meta.outputs.tags }}
          MOVE_LATEST: ${{ steps.meta.outputs.move_latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          expected = sorted(t.rpartition(":")[2] for t in os.environ.get("EXPECTED_TAGS", "").split() if t)
          if sorted(tags) != expected:
              sys.exit(f"::error::pushed tags {sorted(tags)} are not the computed tags {expected}")
          # :latest only for a stable version that owns it (MOVE_LATEST from the
          # check right before the push). The "-" fallback makes a missing or EMPTY VERSION fail
          # closed (a job output that was never set arrives as "", not unset).
          if "latest" in tags and ("-" in (os.environ.get("VERSION") or "-") or os.environ.get("MOVE_LATEST") != "true"):
              sys.exit("::error::a :latest tag was pushed; beta images and older-line patches must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      # cosign and the attestations bind to the digest, so they cover every tag
      # that resolves to it. Prove each pushed tag does (a floating tag moved
      # by a concurrent run would not).
      - name: Check every pushed tag resolves to the signed digest
        if: steps.signref.outcome == 'success'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            # A digest is the sha256 of the manifest's exact bytes, which --raw
            # prints. Do not use --format '{{.Manifest.Digest}}': buildx answers
            # any format that starts with {{.Manifest with its full listing.
            if ! raw_sha="$(docker buildx imagetools inspect "$ref" --raw | sha256sum)"; then
              echo "::error::could not read $ref from the registry"
              exit 1
            fi
            got="sha256:${raw_sha%% *}"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$ref resolves to $got, not the signed digest $DIGEST"
              exit 1
            fi
            echo "$ref -> $DIGEST (signed)"
          done <<< "$TAGS"

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|heads/release/[0-9]+[.][0-9]+|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # beta -> prerelease, never Latest. stable -> a full release, marked
      # Latest only when nothing newer is published on any line, for EVERY one of
      # the five images (gh would otherwise pick Latest by date and mislabel an
      # older-line patch). That is decided here, right before the release is
      # created: a newer stable may have published since the image job, or days
      # ago if this is a re-run.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; leaving it alone"
            exit 0
          fi
          components="backend frontend rpg-builder vn-builder wasm-fragment"
          notes="Images:"
          for c in $components; do
            notes="$notes
          - ${IMAGE_PREFIX}/$c:$VERSION"
          done
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "hugmesh-games $VERSION" --notes "$notes" --generate-notes)
          case "$VERSION" in
            *-*) args+=(--prerelease --latest=false) ;;
            *)
              all_latest=true
              for c in $components; do
                out="$(IMAGE_NAME="$IMAGE_PREFIX/$c" VERSION_FILE=VERSION bash scripts/release-channel.sh)"
                echo "$out"
                move_latest="$(printf '%s\n' "$out" | sed -n 's/^move_latest=//p')"
                if [ "$move_latest" != true ]; then
                  all_latest=false
                fi
              done
              if [ "$all_latest" = true ]; then
                args+=(--latest)
              else
                args+=(--latest=false)
              fi
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
