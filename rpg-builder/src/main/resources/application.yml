spring:
  application:
    name: hugmesh-rpg-builder
  # DB_PASS has NO default (same rule as the backend BFF): a literal fallback
  # here was baked into the jar + image and was what every deployment that
  # did not set DB_PASS ran on, production included. docker-compose.yml
  # supplies it from RPG_BUILDER_DB_PASS; an unset value now fails at connect
  # time instead of silently using a public password.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-rpg-builder}:${DB_PORT:5432}/${DB_NAME:rpg_builder}
    username: ${DB_USER:rpg_builder}
    password: ${DB_PASS:}
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-rpg-builder}:${DB_PORT:5432}/${DB_NAME:rpg_builder}
    username: ${DB_USER:rpg_builder}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    url: jdbc:postgresql://${DB_HOST:postgres-rpg-builder}:${DB_PORT:5432}/${DB_NAME:rpg_builder}
    user: ${DB_USER:rpg_builder}
    password: ${DB_PASS:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validates JWTs minted by Casdoor. Match the BFF's pattern: only
          # jwk-set-uri, no issuer-uri. Setting issuer-uri makes Spring fetch
          # /.well-known/openid-configuration at startup, which Casdoor
          # doesn't expose at the location Spring expects, so the bean
          # creation fails and the service never starts.
          jwk-set-uri: ${CASDOOR_ENDPOINT:http://casdoor:8000}/.well-known/jwks

server:
  port: 8080

app:
  bff:
    # Service-to-service URL for the BFF upload endpoint. The build
    # worker forwards the building user's bearer token, so the BFF
    # sees the upload as that user (admin or publisher).
    base-url: ${APP_BFF_BASE_URL:http://api:8080}
  build:
    # Worker tick interval — how often the queue is drained.
    tick: ${APP_BUILD_TICK:PT5S}
    # When true, the worker invokes the Godot CLI (GodotExporter) to
    # produce a real WASM bundle. When false (default in dev/e2e), it
    # emits a placeholder bundle so the rest of the pipeline can run
    # end-to-end without the multi-GB Godot image + export templates.
    godot-enabled: ${APP_BUILD_GODOT_ENABLED:false}
    # Godot 4 binary (on PATH or absolute) for the headless Web export,
    # with the matching Web export templates installed. Only consulted
    # when godot-enabled=true (the godot-export compose profile ships an
    # image that provides both).
    godot-bin: ${APP_BUILD_GODOT_BIN:godot}
    # Export preset name in export_presets.cfg (the template ships "Web").
    godot-preset: ${APP_BUILD_GODOT_PRESET:Web}
    # Hard cap on a single export (ISO-8601 duration) so a hung Godot
    # process can't wedge the single-flight queue.
    godot-timeout: ${APP_BUILD_GODOT_TIMEOUT:PT10M}
    # Directory holding the compiled hugmesh-bridge binaries
    # (hugmesh_bridge.wasm + libhugmesh_bridge.so) baked into each
    # rendered project's bin/ so the produced WASM carries the multiplayer
    # HostBridge. Empty (dev default) → skipped (non-multiplayer bundle).
    bridge-dir: ${APP_BUILD_BRIDGE_DIR:}
    # Path to a per-project workdir root on the container's writable
    # FS. Each build gets a sub-directory `<project-id>/<build-id>/`.
    workdir: ${APP_BUILD_WORKDIR:/var/hugmesh/rpg-builds}
    # Path to the assets dir (uploaded icons / portraits).
    assets-dir: ${APP_BUILD_ASSETS_DIR:/var/hugmesh/rpg-assets}
    # Maximum bundle bytes the worker will POST to the BFF.
    max-bundle-bytes: ${APP_BUILD_MAX_BUNDLE_BYTES:209715200}

logging:
  level:
    games.hugmesh.rpgbuilder: INFO
    org.springframework.r2dbc: WARN
