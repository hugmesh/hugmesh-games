appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
# No password here on purpose: docker-compose.yml supplies the full DSN as the
# `dataSourceName` environment variable (Casdoor reads env before this file),
# built from GAMES_DB_PASS. Without that env var Casdoor cannot authenticate.
dataSourceName = "user=threewizards host=postgres port=5432 dbname=casdoor sslmode=disable"
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
staticBaseUrl = https://cdn.casbin.org
verificationCodeTimeout = 10
initScore = 2000
logPostOnly = true
origin = http://localhost:8000
initDataFile = /tmp/init_data.json
