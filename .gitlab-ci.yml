# HugMesh CI — build + push the games service images to the in-cluster GitLab
# container registry. Monorepo: one image per deployable component subdir, built
# in parallel on the privileged x86 runner (e2e is a test image, not built here).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.
#
# Stages, in order:
#   test   run the repo's unit suites (see the `test` stage below). Gates
#          `build` via `needs:` so a red suite on `main` fails the pipeline
#          BEFORE an image is built and pushed.
#   build  build + push the per-component images (UNCHANGED).
#   sca    OWASP Dependency-Check over the games components INCLUDING the Rust
#          hugmesh-bridge (--enableExperimental, --failOnCVSS 7).
#   dast   the hugmesh.games OWN continuous OWASP pen-test pipeline — runs the
#          vendored harness (tests/pentest/run-pentest.sh --pipeline games) against
#          the games env-test-build (docker-compose.e2e.yml). Independent of the
#          main platform pipeline (the TWO-SEPARATE-WORKFLOWS rule).
#   load   the OPT-IN k6 LOAD stage — OFF BY DEFAULT, gated PENTEST_LOAD=1 (GitLab
#          schedule or manual web). Runs the SAME vendored harness with --load
#          (realistic-mixed + stress + nightly soak), reading the SAME per-persona
#          tokens.env the dast seed mints. Slow/heavy, so never on an MR.
# CI is GitLab-only (no .github/workflows). No secrets in this file — every
# credential (Casdoor admin / the throwaway TEST-realm password / NVD key) is a
# masked CI variable read at runtime.
#
# The `test` stage below runs four of `make test`'s six legs (test-backend,
# test-frontend, test-games-js, test-rust-cores). The two NOT covered, and why,
# are documented on the stage itself — neither can run on this runner, which is
# Tailscale-only and cannot reach github.com.
#
# ─────────────────────────────────────────────────────────────────────────────
# Centralized OWASP pen-test stage (ONE source of truth, org-wide).
# Pulls the generator's reusable hidden jobs (.pentest-sca / .pentest-dast-baseline
# / .pentest-dast-full) so this repo's `pentest` stage stays in lockstep with the
# org standard. This is ADDITIVE: the games-specific inline sca/dast/load jobs
# above keep running --pipeline games (Rust crate analysis + the games personas /
# per-brand catalog + DOMAIN_ guard), which the generic centralized template does
# not cover. The pentest:* jobs below run the centralized harness alongside.
# ─────────────────────────────────────────────────────────────────────────────
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, sca, dast, load, pentest]

# ─────────────────────────────────────────────────────────────────────────────
# test — the repo's unit suites, run BEFORE anything is built or pushed.
#
# These are the same commands `make test` runs locally, so a green pipeline and
# a green `make test` mean the same thing. Every suite runs inside a disposable
# container (the runner has docker but no JDK / node / cargo toolchain), which
# is the same structure `build:image` below already uses.
#
# --user "$(id -u):$(id -g)" on every run: without it the container writes
# target/ and node_modules/ into the build directory as root, and the runner's
# next `git clean -ffdx` cannot remove them. HOME is redirected because a
# uid-mapped container has no writable home (mvnw unpacks Maven into $HOME/.m2,
# npm wants a cache dir).
#
# TWO of `make test`'s six legs are deliberately NOT here:
#
#   make test-godot  needs a `godot4` binary. This runner is Tailscale-only and
#                    cannot reach github.com — the same constraint that made
#                    build:image route its Godot toolchain fetch through
#                    GODOT_MIRROR_BASE_URL (see the matrix comment above). Once
#                    that in-cluster mirror is seeded, add a test:godot job that
#                    fetches from it and runs `make test-godot`.
#   make test-rust   `extensions/hugmesh-bridge` depends on gdext by git URL
#                    (`godot = { git = "https://github.com/godot-rust/gdext" }`),
#                    so it cannot resolve here either. The 16 pure-Rust game
#                    cores it wraps have NO external dependencies at all, so
#                    test:rust-cores below runs them `--offline`. That is a
#                    strict SUPERSET of what `make test-rust` covers today
#                    (which only reaches hugmesh-chess + hugmesh-connect-four,
#                    as the bridge's two path dependencies) — `make
#                    test-rust-cores` runs the identical loop locally.
#
# Browser-level e2e stays with `make e2e` / the dast stage; this stage is unit
# tests only, so it stays fast enough to gate every merge request.
# ─────────────────────────────────────────────────────────────────────────────
.test:base:
  stage: test
  tags: [hugmesh-x86, privileged]
  rules:
    # A SUPERSET of build:image's rules (default branch + tag), plus merge
    # requests — so every job in `needs:` below always exists in a pipeline
    # that builds, and an MR gets the gate too.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Backend (Spring Boot / JUnit) — 700 tests as of this commit.
#
# TWO non-obvious requirements, both measured by running this exact command:
#
#   * The WHOLE repo is mounted and the workdir is /workspace/backend, not just
#     backend/. CharacterModelSyncTest (the decision-028 consumer-copy drift
#     guard) reads ../rpg-builder/src/main/java/games/hugmesh/character and
#     FAILS — deliberately, "a missing canonical tree means drift CANNOT be
#     checked, which is a failure, not a skip" — when only backend/ is visible.
#   * The docker socket is mounted and the container is on the host network.
#     GameUploadIntegrationTest, SessionMemberLivenessMigrationTest and
#     ShadowsOfTheNetFederationSeedTest start a real Postgres via Testcontainers;
#     without a reachable daemon all three error with "Could not find a valid
#     Docker environment". Sibling containers publish their ports on the host,
#     so --network=host is what lets the test JVM reach them on localhost.
test:backend:
  extends: .test:base
  cache:
    # Maven repo + the wrapper's Maven distribution. Cold, mvnw downloads ~290 MB
    # before a single test runs; the cache makes that a one-off per runner.
    key: maven-repo
    paths:
      - .ci-home/.m2/repository/
      - .ci-home/.m2/wrapper/
  script:
    - mkdir -p .ci-home
    - >
      docker run --rm --network=host
      --user "$(id -u):$(id -g)"
      -e HOME=/workspace/.ci-home
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "${CI_PROJECT_DIR}:/workspace"
      -w /workspace/backend
      eclipse-temurin:25-jdk
      ./mvnw -B test
  artifacts:
    when: always
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
    expire_in: 7 days

# Angular (Karma + Jasmine): 219 specs across 27 spec files. Reuses
# frontend/Dockerfile.test — the SAME image `make test-frontend` builds — which
# bakes Chromium, so the runner needs no browser. --shm-size=1gb because
# headless Chrome dies on the default 64 MB /dev/shm.
test:frontend:
  extends: .test:base
  script:
    - docker build -q -f frontend/Dockerfile.test -t hugmesh-games-frontend-test frontend
    - >
      docker run --rm --init --shm-size=1gb
      --user "$(id -u):$(id -g)"
      -e HOME=/tmp
      -e npm_config_cache=/tmp/.npm
      -v "${CI_PROJECT_DIR}/frontend:/work"
      -w /work
      hugmesh-games-frontend-test
      sh -c 'npm ci --no-audit --no-fund && npm test'

# The plain-node functional suites under games/_shared/test/ (18 files): the
# web-native wasm engines plus the browser-only JS a Godot game injects with
# JavaScriptBridge.eval, which a headless Godot run can never execute. Same
# loop as `make test-games-js`; :ro because these tests only read.
test:games-js:
  extends: .test:base
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -v "${CI_PROJECT_DIR}:/workspace:ro"
      -w /workspace
      node:22-alpine
      sh -c 'set -e; for t in games/_shared/test/*.test.mjs; do echo "→ node $t"; node "$t"; done'

# The 16 first-party Rust game cores + their wasm shim crates (496 tests). Every
# one of these crates is dependency-free (path dependencies only, and each ships
# a Cargo.lock), so --offline is not a hope, it is the contract: this job must
# never touch crates.io, which the runner cannot reach anyway. hugmesh-bridge is
# skipped — see the git-dependency note on the stage comment above.
# CARGO_TARGET_DIR points outside the mount so no build output lands in the
# build directory.
test:rust-cores:
  extends: .test:base
  script:
    - >
      docker run --rm
      --user "$(id -u):$(id -g)"
      -e CARGO_HOME=/tmp/cargo
      -e CARGO_TARGET_DIR=/tmp/cargo-target
      -v "${CI_PROJECT_DIR}:/workspace:ro"
      -w /workspace
      rust:1-slim
      sh -c 'set -e; for d in extensions/hugmesh-*/; do case "$d" in */hugmesh-bridge/) continue;; esac; echo "→ cargo test in $d"; ( cd "$d" && cargo test --offline --quiet ); done'

build:image:
  stage: build
  # Gate: never build or push an image from a tree whose unit suites are red.
  needs: [test:backend, test:frontend, test:games-js, test:rust-cores]
  tags: [hugmesh-x86, privileged]
  parallel:
    matrix:
      # Most components build from their own subdir; wasm-fragment's Dockerfile
      # COPYs from backend/ + wasm-fragment/, so it needs the repo ROOT context.
      # rpg-builder/vn-builder additionally fetch the Godot toolchain at build
      # time (see their Dockerfiles' "Godot toolchain stage" comment) — the
      # privileged x86 runner is Tailscale-only and cannot reach github.com, so
      # GODOT_RELEASE_BASE_URL (below) redirects that fetch to an in-cluster
      # mirror. GODOT_MIRROR is empty for the other 3 components, which don't
      # declare that build ARG at all (an unset/empty --build-arg for an ARG a
      # Dockerfile never references is a silent no-op, not an error).
      - { COMPONENT: backend,       CONTEXT: backend,       DOCKERFILE: backend/Dockerfile,       GODOT_MIRROR: "" }
      - { COMPONENT: frontend,      CONTEXT: frontend,      DOCKERFILE: frontend/Dockerfile,      GODOT_MIRROR: "" }
      - { COMPONENT: rpg-builder,   CONTEXT: rpg-builder,   DOCKERFILE: rpg-builder/Dockerfile,   GODOT_MIRROR: "${GODOT_MIRROR_BASE_URL}" }
      - { COMPONENT: vn-builder,    CONTEXT: vn-builder,    DOCKERFILE: vn-builder/Dockerfile,    GODOT_MIRROR: "${GODOT_MIRROR_BASE_URL}" }
      - { COMPONENT: wasm-fragment, CONTEXT: ".",           DOCKERFILE: wasm-fragment/Dockerfile, GODOT_MIRROR: "" }
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # One image per component: $CI_REGISTRY_IMAGE/<component>. GODOT_MIRROR_BASE_URL
    # is an optional project CI/CD variable (unset until the mirror below is
    # seeded) pointing at this project's own generic package registry, e.g.
    # "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/godot"
    # — the SAME convention hugmesh-generator's `deliver:isos` job uses. NOTE:
    # do NOT include the Godot version segment here — the Dockerfiles' godot
    # stage appends "/${GODOT_VERSION}" themselves (base="${GODOT_RELEASE_BASE_URL}/${GODOT_VERSION}"),
    # so a trailing "/4.6-stable" here would double up and 404 every fetch. Until
    # it's set, GODOT_MIRROR is empty and the Dockerfile ARG default (public
    # GitHub releases) applies, i.e. today's (non-air-gapped) behavior is unchanged.
    - |
      EXTRA_ARGS=()
      if [ -n "${GODOT_MIRROR}" ]; then
        EXTRA_ARGS+=(--build-arg "GODOT_RELEASE_BASE_URL=${GODOT_MIRROR}")
      fi
    - docker build --pull -f "$DOCKERFILE" "${EXTRA_ARGS[@]}" -t "$CI_REGISTRY_IMAGE/$COMPONENT:$TAG" -t "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_REF_SLUG" "$CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$COMPONENT:$TAG"
    - docker push "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_REF_SLUG"

# ─────────────────────────────────────────────────────────────────────────────
# sca — OWASP Dependency-Check over the games components, INCLUDING the Rust
# hugmesh-bridge GDExtension (--enableExperimental analyses extensions/
# hugmesh-bridge/Cargo.lock alongside the Java BFF + maker services (Maven) and
# the Angular host + remotes (npm)). Fails the build on a CVSS >= 7 finding.
#
# The NVD feed is cached in a persistent per-project cache so re-runs don't
# re-download it. NVD_API_KEY (optional, masked CI variable) speeds the sync. No
# secrets in this file — the wrapper reads NVD_API_KEY from the environment.
# ─────────────────────────────────────────────────────────────────────────────
sca:dependency-check:
  stage: sca
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  cache:
    # Persist the NVD feed across runs (keyed globally so every branch shares it).
    key: dependency-check-nvd
    paths:
      - out/pentest/sca/nvd-cache/
  script:
    # The wrapper prefers a native dependency-check CLI, else the Docker image
    # (owasp/dependency-check). --enableExperimental is ON for the Rust crate
    # analysis; --failOnCVSS 7 is the gate. Reports land in out/pentest/sca.
    - bash tests/pentest/dependency-check/run-sca.sh
        --pipeline games
        --cvss 7
        --out out/pentest/sca
        --data out/pentest/sca/nvd-cache
  artifacts:
    when: always
    paths:
      - out/pentest/sca/dependency-check-report.html
      - out/pentest/sca/dependency-check-report.sarif
      - out/pentest/sca/dependency-check-report.json
    reports:
      # GitLab renders Dependency-Check SARIF in the MR security widget.
      sast: out/pentest/sca/dependency-check-report.sarif
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────────────────────
# dast — the hugmesh.games OWN continuous OWASP pen-test pipeline. Runs the
# vendored harness against the games env-test-build (docker-compose.e2e.yml): the
# games front door + the games BFF + the games Casdoor org, exercising the games
# personas (player/mod/publisher/admin) across the per-brand games-catalog
# partitioning + the DOMAIN_ guard.
#
#   MR / default branch : baseline (passive + spider + custom boundary probes).
#   scheduled           : full (the above + an ENABLED active scan).
#
# No secrets in this file — the seed step reads the throwaway TEST-realm password
# (PENTEST_SEED_PASSWORD / the games E2E_*_PASSWORD pattern) + the Casdoor admin
# creds from masked CI variables at runtime and writes only short-lived bearers to
# a gitignored tokens.env. The DoS probe is bounded (asserts the nginx 429).
# ─────────────────────────────────────────────────────────────────────────────
.dast:base:
  stage: dast
  tags: [hugmesh-x86, privileged]
  variables:
    # The vendored harness spins the games compose, seeds personas, scans, and
    # always tears down (even on a mid-scan failure). ZAP runs as the host-net
    # zaproxy image; CASDOOR_GAMES_URL + PENTEST_SEED_PASSWORD + CASDOOR_ADMIN_*
    # come from CI variables (the profile defaults are non-secret placeholders).
    PENTEST_HOST_PORT: "8080"
  artifacts:
    when: always
    paths:
      - out/pentest/
    expire_in: 30 days

dast:baseline:
  extends: .dast:base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan baseline --pipeline games

dast:full:
  extends: .dast:base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan full --pipeline games

# ─────────────────────────────────────────────────────────────────────────────
# load — the OPT-IN k6 LOAD + DoS-resilience stage. OFF BY DEFAULT.
#
# Runs the SAME vendored games harness with --load (k6 staged scenarios:
# realistic-mixed + stress + the nightly soak), reading the SAME per-persona
# tokens.env the dast seed mints — so k6 runs AS the real seeded games personas
# across the per-brand catalog. The stress scenario ramps PAST the games nginx
# limit_req zone rates (api 50/s, sse 30/s, auth 5/s): a 429 is EXPECTED/PASS, a
# 5xx is FAIL (graceful degradation must throttle, not error).
#
# DOUBLE-GATED + heavy: this job runs ONLY when PENTEST_LOAD == "1" AND the
# pipeline is a SCHEDULE or a manual WEB run — never on an MR or a plain
# default-branch push. Configure the schedule (PENTEST_LOAD=1, SOAK=1 for the
# nightly soak) in the GitLab UI; see tests/pentest/load/SCHEDULE-AND-GATE.md.
# The harness's --load step is itself gated on PENTEST_LOAD=1, so this is opt-in
# end-to-end. No secrets here — same masked CI variables as the dast seed.
# ─────────────────────────────────────────────────────────────────────────────
load:k6:
  stage: load
  tags: [hugmesh-x86, privileged]
  variables:
    PENTEST_HOST_PORT: "8080"
    # NOTE: PENTEST_LOAD is deliberately NOT defaulted here — it must arrive from
    # the SCHEDULE / manual-run variable, so the load stage is OFF BY DEFAULT and
    # only un-gates when an operator explicitly sets PENTEST_LOAD=1 (the harness's
    # own --load step is gated on it too). SOAK=1 (the nightly schedule) adds soak.
  rules:
    # Scheduled pipeline (the nightly cadence) — the schedule must set PENTEST_LOAD=1.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PENTEST_LOAD == "1"'
    # Manual web run — add PENTEST_LOAD=1 in Run pipeline to include it.
    - if: '$CI_PIPELINE_SOURCE == "web" && $PENTEST_LOAD == "1"'
      when: manual
      allow_failure: true
  script:
    # The harness spins the games compose, seeds personas (mints tokens.env), runs
    # the ZAP/SCA scan, THEN the k6 load stage (--load, gated on PENTEST_LOAD=1),
    # and always tears down. --scan full pairs the load run with the active scan on
    # the nightly schedule; the load report lands in out/pentest/<run>/load.
    - bash tests/pentest/run-pentest.sh --env compose --scan full --pipeline games --load
  artifacts:
    when: always
    paths:
      - out/pentest/
    expire_in: 30 days

# ─────────────────────────────────────────────────────────────────────────────
# pentest — the CENTRALIZED OWASP stage from the generator's reusable template
# (included above). These thin jobs `extends:` the hidden `.pentest-*` jobs so the
# org-standard SCA + baseline DAST run here too, keeping one source of truth.
#
# allow_failure: true — non-blocking (this repo's hard gate is the games-specific
# sca:dependency-check --failOnCVSS 7 above); these mirror the org posture without
# breaking the build while the centralized harness/feed warms up. Rules mirror the
# repo's existing security jobs: default branch + merge requests.
# ─────────────────────────────────────────────────────────────────────────────
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
