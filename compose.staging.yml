# HugMesh Games — staging overlay
#
# Apply on top of the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.staging.yml up -d
#
# Routing model on staging:
#   <service>.staging.hugmesh.games            (each remote / API / wasm)
#   staging.hugmesh.games                      (host shell)
#
# This file is OPINIONATED about three things:
#
#   1. Image tags. Staging containers pin the immutable digest produced
#      by CI rather than `:dev` so a redeploy is reproducible. Override
#      $HUGMESH_TAG (e.g. HUGMESH_TAG=2026-04-26.42) before
#      `docker compose up -d`.
#
#   2. Public origins. Spring Boot reads SPRING_WEB_CORS_ALLOWED_ORIGINS
#      so the BFF only accepts requests whose Origin header is on
#      staging.hugmesh.games. The host nginx isn't reverse-proxied
#      here — a load balancer fronts the stack and terminates TLS for
#      *.staging.hugmesh.games — so we expose the host on a high
#      internal port (8080) and let the LB connect to it.
#
#   3. Casdoor base URL. The login flow needs an absolute redirect URI
#      that matches the public DNS so Casdoor accepts the callback.
#
# DB passwords are NOT inherited literals: the base file requires
# GAMES_DB_PASS, RPG_BUILDER_DB_PASS and VN_BUILDER_DB_PASS (`${VAR:?}`),
# so staging refuses to start until they are supplied from the
# environment. Use managed values, not a dev .env from `make db-env`.
#
# Production: see compose.prod.yml for the *.hugmesh.games equivalent.

services:
  postgres:
    # Staging keeps a managed Postgres on a separate volume so a wipe
    # never crosses with prod restore.
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    ports: !reset []   # don't expose Postgres publicly even via the LB

  cassandra:
    ports: !reset []
    volumes:
      - cassandra-staging:/var/lib/cassandra

  casdoor:
    environment:
      CASDOOR_ORIGIN: "https://login.staging.hugmesh.games"
      CASDOOR_PUBLIC_BASE_URL: "https://login.staging.hugmesh.games"

  api:
    image: hugmesh-games/bff:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      # Fail fast at boot if any prod-sensitive credential (Casdoor
      # client-secret, DB password) is unset (NIST IA-5 / OWASP ASVS
      # 6.2.2). Staging mirrors prod posture; creds arrive via the same
      # k8s + ESO + Vault path.
      APP_SECURITY_REQUIRE_MANAGED_SECRETS: "true"
      SPRING_WEB_CORS_ALLOWED_ORIGINS: "https://staging.hugmesh.games,https://*.staging.hugmesh.games"
      APP_PUBLIC_HOST: staging.hugmesh.games
      APP_PUBLIC_SCHEME: https
      CASDOOR_PUBLIC_BASE_URL: https://login.staging.hugmesh.games
      # Per-environment upload limits. Staging accepts the same
      # large bundles as prod so dev → staging → prod parity is
      # preserved; tune via env overrides if a particular staging
      # cluster has tighter disk.
      APP_MAX_IN_MEMORY:    ${APP_MAX_IN_MEMORY:-1MB}
      APP_MAX_PART_SIZE:    ${APP_MAX_PART_SIZE:-2048MB}
      APP_MAX_PARTS:        ${APP_MAX_PARTS:-32}
      APP_CODEC_MAX:        ${APP_CODEC_MAX:-16MB}
      APP_UPLOADS_GAMES_DIR: /var/hugmesh/games
    expose: ["8080"]
    volumes:
      # Bind to a real host directory in staging so a `docker volume
      # rm` can't accidentally take the upload tree with it. Override
      # APP_GAMES_UPLOAD_HOST_DIR for managed-storage targets.
      - !reset null
      - ${APP_GAMES_UPLOAD_HOST_DIR:-/srv/hugmesh/staging/games-uploads}:/var/hugmesh/games

  frontend:
    image: hugmesh-games/portal-host:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
    environment:
      # Consumed by frontend/nginx.conf via envsubst on container start.
      PUBLIC_HOSTNAME: staging.hugmesh.games
      ALLOW_ORIGIN: "https://*.staging.hugmesh.games"
    ports:
      # Bound only to localhost — the load balancer talks to this port
      # over the staging private network.
      - "127.0.0.1:8081:8080"

  login:
    image: hugmesh-games/login-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
  admin:
    image: hugmesh-games/admin-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
  api-docs:
    image: hugmesh-games/api-docs-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
  games-three-wizards:
    image: hugmesh-games/three-wizards-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
  games-dodecahedron:
    image: hugmesh-games/dodecahedron-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}
  wasm-fragment:
    image: hugmesh-games/wasm-fragment:${HUGMESH_TAG:?HUGMESH_TAG must be set on staging}

volumes:
  pgdata-staging:
  cassandra-staging:
