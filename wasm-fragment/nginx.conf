# Asset-tier nginx for the federated wasm-fragment service.
#
# Serves Godot bundles directly from disk so the api service stops
# being on the binary asset path. Each game's level dir was copied
# into /usr/share/nginx/html/<slug>/ at image build time (see
# Dockerfile); the path shape matches the BFF's /api/assets/levels/
# layout so the patched Godot index.html's relative asset refs
# (index.js, index.wasm, index.pck) resolve correctly.
#
# Federated remote components (three-wizards, dodecahedron) hit this
# via the host's nginx proxy at /_remotes/wasm-fragment/<slug>/
# index.html — see frontend/nginx.conf + nginx-tls.conf.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation.
    # The federated host shares the same COOP/COEP headers so the
    # browser sees a consistent isolation policy across the seam.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # CORP must be set on every response that gets embedded into a
    # COEP:require-corp page — the host's iframe load fails with
    # net::ERR_BLOCKED_BY_RESPONSE without this. The host's nginx
    # proxies /_remotes/wasm-fragment/ to this service so the response
    # comes back with these headers intact.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin  "*"             always;

    # Godot bundle MIME types — nginx's stock mime.types doesn't know
    # .wasm or .pck so it falls back to application/octet-stream.
    # Browsers happily load .wasm via WebAssembly.instantiateStreaming
    # only when the response carries application/wasm; without the
    # right type the streaming compile path falls back to a blocking
    # ArrayBuffer fetch which is meaningfully slower for the 37MB
    # cave/field bundles.
    types {
        application/wasm                wasm;
        application/octet-stream        pck;
        text/html                       html;
        text/javascript                 js;
        application/json                json;
        text/css                        css;
        image/png                       png;
        image/jpeg                      jpg jpeg;
        image/svg+xml                   svg;
    }

    # Backwards-compat: the federation_modules.wasm-fragment row's
    # historical /fragment?slug= endpoint stays as a redirect. New
    # callers should use /<slug>/index.html directly.
    location = /fragment {
        if ($arg_slug = "") { return 400 'wasm-fragment: missing ?slug='; }
        return 302 /$arg_slug/index.html;
    }

    # Static-serve the level bundle. try_files lets a missing file
    # fall through to a 404 rather than redirecting to /index.html
    # (which would mask asset-typo bugs as "page loaded fine").
    location / {
        try_files $uri =404;
    }
}
