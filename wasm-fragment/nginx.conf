# Asset-tier nginx for the federated wasm-fragment service.
#
# Serves Godot bundles directly from disk so the api service stops
# being on the binary asset path. Each game's level dir was copied
# into /usr/share/nginx/html/<slug>/ at image build time (see
# Dockerfile); the path shape matches the BFF's /api/assets/levels/
# layout so the patched Godot index.html's relative asset refs
# (index.js, index.wasm, index.pck) resolve correctly.
#
# Federated remote components (three-wizards, dodecahedron) hit this
# via the host's nginx proxy at /_remotes/wasm-fragment/<slug>/
# index.html — see frontend/nginx.conf + nginx-tls.conf.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation.
    # The federated host shares the same COOP/COEP headers so the
    # browser sees a consistent isolation policy across the seam.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # CORP must be set on every response that gets embedded into a
    # COEP:require-corp page — the host's iframe load fails with
    # net::ERR_BLOCKED_BY_RESPONSE without this. The host's nginx
    # proxies /_remotes/wasm-fragment/ to this service so the response
    # comes back with these headers intact.
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Access-Control-Allow-Origin  "*"             always;

    # ── Bundle-tier CSP + XFO (OWN headers, so the gateway fallback never
    # applies). hugmesh-gateway's SecurityConfig stamps a blanket fallback
    # (`frame-ancestors 'none'` + `X-Frame-Options: DENY`) onto any upstream
    # response that carries no Content-Security-Policy of its own — which
    # makes every same-origin <iframe> of /_remotes/wasm-fragment/<slug>/
    # index.html from the shell-mounted games remote come up BLANK with no
    # server error. Sending the policy here wins over the fallback.
    #   - frame-ancestors 'self' + XFO SAMEORIGIN: the shell page and this
    #     bundle share the apex origin behind the fe-gateway, so the games
    #     remote's <iframe> is admitted and any third-party framing is not.
    #   - script-src 'unsafe-inline': every bundle index.html carries an inline
    #     bootstrap <script> (the web-native games: `<script type="module">`
    #     importing ./_shared/game-frame.js; the Godot exports: the Engine
    #     config block). 'wasm-unsafe-eval': WebAssembly.instantiate for the
    #     .wasm payloads. blob: for the worker/module URLs the Godot loader
    #     mints. NO 'unsafe-eval' — not needed by any shipped bundle (measured:
    #     the 14 web-native bundles iframed + the 5 Godot bundles top-level,
    #     zero CSP console errors). Add it ONLY with a named bundle that fails.
    #   - connect-src/worker-src/media-src 'self' blob:: Godot's audio worklets
    #     and threaded wasm workers load from blob: URLs; the SSE/controls
    #     calls the _shared host client makes are same-origin.
    # nginx add_header does NOT merge across blocks: any location that sets
    # its own add_header (the .wasm/.pck block below) must REPEAT this set.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Godot bundle MIME types — nginx's stock mime.types doesn't know
    # .wasm or .pck so it falls back to application/octet-stream.
    # Browsers happily load .wasm via WebAssembly.instantiateStreaming
    # only when the response carries application/wasm; without the
    # right type the streaming compile path falls back to a blocking
    # ArrayBuffer fetch which is meaningfully slower for the 37MB
    # cave/field bundles.
    types {
        application/wasm                wasm;
        application/octet-stream        pck;
        text/html                       html;
        text/javascript                 js;
        application/json                json;
        text/css                        css;
        image/png                       png;
        image/jpeg                      jpg jpeg;
        image/svg+xml                   svg;
    }

    # Backwards-compat: the federation_modules.wasm-fragment row's
    # historical /fragment?slug= endpoint stays as a redirect. New
    # callers should use /<slug>/index.html directly.
    location = /fragment {
        if ($arg_slug = "") { return 400 'wasm-fragment: missing ?slug='; }
        return 302 /$arg_slug/index.html;
    }

    # Inject the HugMesh shim into every Godot index.html. The shim
    # wraps console.error / window.onerror / unhandledrejection and
    # postMessages each capture to the host shell, plus drains incoming
    # SD_INPUT_EVENT messages onto a window-level queue the GDScript
    # bridge polls. We use sub_filter to splice the shim's <script>
    # tag in just before </head> so the patched Godot index.html
    # doesn't have to know the shim exists.
    #
    # sub_filter only runs on text/html responses (default 'on' for
    # the path we configure) and only fires once per response unless
    # sub_filter_once is off — the patched Godot bundles have exactly
    # one </head>, so default once-mode is right.
    location ~ \.html$ {
        sub_filter_types text/html;
        # Use a path RELATIVE to the .html so the script resolves correctly
        # under both serving topologies:
        #   - direct (testing this nginx alone): /<slug>/index.html → ../hugmesh-shim.js → /hugmesh-shim.js
        #   - via host proxy: /_remotes/wasm-fragment/<slug>/index.html
        #     → ../hugmesh-shim.js → /_remotes/wasm-fragment/hugmesh-shim.js
        # An absolute /hugmesh-shim.js was the previous shape — it
        # resolves at the HOST origin under proxying, where the host
        # nginx serves Angular's index.html as a fallback and the shim
        # never loads. Confirmed by `shimInstalled: false` in iframes.
        sub_filter '</head>'
                   '<script src="../hugmesh-shim.js" defer></script></head>';
        sub_filter_once on;
        try_files $uri =404;
    }

    # WASM bundles + .pck change every Godot re-export but keep the
    # same filename. Without `Cache-Control: no-cache` the browser
    # silently serves a stale copy of hugmesh_bridge.wasm /
    # index.wasm / index.side.wasm, which manifests as ghost
    # `__cpp_exception is not a Tag` LinkErrors after a panic-strategy
    # fix has already shipped server-side. The ETag still allows
    # 304 Not Modified responses on actual matches so this is cheap.
    location ~ \.(wasm|pck)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin  "*"             always;
        # Repeated from the server block — this location's own add_header
        # lines reset inheritance, and a .wasm fetched without the bundle-tier
        # CSP would fall back to the gateway's DENY policy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }

    # Static-serve everything else (.js / asset/*).
    location / {
        try_files $uri =404;
    }
}
