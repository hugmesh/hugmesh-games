# Compose overlay that swaps the JVM `api` service for a GraalVM
# native-image build. Drop-in: `docker compose -f docker-compose.yml
# -f docker-compose.native.yml up`.
#
# Tradeoffs (PLAN section D):
#   ✓ Cold start ~50–100 ms (vs ~3 s on the JVM)
#   ✓ RSS ~100 MB (vs ~400 MB)
#   ✓ Final image ~150 MB (vs ~430 MB on eclipse-temurin:21-jre)
#   ✗ Build is slow (~5–10 min) and memory-hungry (~6–8 GB)
#   ✗ No JIT / class hot-swap; reflection requires explicit hints
#     (see backend/src/main/java/com/threewizards/aot/SnapdragonRuntimeHints.java)
#
# Validation strategy (separate workflow, not run on every PR):
#   1. `make build-backend-native` produces snapdragon-gaming-bff:native.
#   2. `docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#                      -f docker-compose.native.yml \
#                      up -d ...` (then make e2e steps).
#   3. Expect a few rounds of missing-hint discovery (Casdoor JWKS
#      verification, Springdoc @Operation reflection, Liquibase singleton
#      scope) — fold each new hint into SnapdragonRuntimeHints.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.native
    image: snapdragon-gaming-bff:native
    # Native binary doesn't take JAVA_TOOL_OPTIONS; clear it from the
    # base profile to avoid spurious warnings on startup.
    environment:
      JAVA_TOOL_OPTIONS: ""
