[package]
name = "hugmesh-battleship"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party Battleship rules engine for hugmesh.games. Pure, deterministic, dependency-free. Host-authoritative hidden boards: the host holds BOTH fleets and reveals only each shot's result. Compiles native (cargo test) and to wasm32 for the in-browser game — the server runs NO game logic, it only streams events. See docs/multiplayer-chess-design.md for the platform model."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
