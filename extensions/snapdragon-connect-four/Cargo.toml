[package]
name = "snapdragon-connect-four"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party Connect Four rules engine for snapdragon.games. Pure, deterministic, dependency-free. Compiles native (cargo test) and to wasm32 for the in-browser game — the server runs NO game logic, it only streams events. Host-authoritative; the guest re-validates against its own engine copy. See docs/multiplayer-chess-design.md for the platform model."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
