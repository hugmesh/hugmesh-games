[package]
name = "hugmesh-minesweeper-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin C-ABI / JSON-over-linear-memory WASM shim around hugmesh-minesweeper. Compiles to a tiny freestanding wasm32-unknown-unknown module (NOT emscripten, NOT wasi, NO wasm-bindgen) with ZERO host imports, so the browser can run the authoritative Minesweeper rules via WebAssembly.instantiateStreaming. Exports a bump allocator (alloc/dealloc) plus the Game ops (mine_new/mine_reveal/mine_flag/mine_state/mine_status) over a single global Game instance. The core crate is left UNMODIFIED; all JSON marshalling lives here and reuses the engine's EXISTING minesweeper.snapshot wire shape verbatim."

[lib]
# cdylib so the build emits a freestanding .wasm. No rlib needed — this crate is
# only ever the wasm entrypoint, never linked into another Rust target.
crate-type = ["cdylib"]

[dependencies]
# A path dependency on the pure rules engine and NOTHING else — keeping the wasm
# module dependency-free (no serde, no wasm-bindgen) so it has no host imports
# and stays tiny. The engine ALREADY emits its own JSON (Game::to_json emits the
# `minesweeper.snapshot` shape); this shim only marshals bytes across the
# linear-memory ABI and reuses that EXISTING wire shape verbatim.
hugmesh-minesweeper = { path = "../hugmesh-minesweeper" }

[profile.release]
opt-level = "z"
lto = true
# A single codegen unit lets LTO strip the most dead code from the freestanding
# module; panic=abort drops the unwinding tables the host never needs.
codegen-units = 1
panic = "abort"
