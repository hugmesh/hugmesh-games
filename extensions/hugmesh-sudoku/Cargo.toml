[package]
name = "hugmesh-sudoku"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party single-player Sudoku puzzle engine for hugmesh.games. Pure, deterministic, dependency-free. Compiles native (cargo test) and to wasm32 for the in-browser puzzle — runs ENTIRELY in the browser, the server is not involved (no multiplayer, no relay). All randomness (solution generation + cell removal) comes from a small seeded PRNG so every game is reproducible. See docs/multiplayer-chess-design.md for the platform engine model this mirrors."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
