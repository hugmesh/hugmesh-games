[package]
name = "hugmesh-bomberman"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party two-player Bomberman engine for hugmesh.games. Pure, deterministic, dependency-free. A fixed-timestep tick simulation: it advances by discrete ticks given each player's input for that tick, and the SAME seed + SAME inputs always produce the SAME result — so the host is authoritative and the guest re-simulates / re-validates. Compiles to wasm32 for the in-browser game (the server only streams inputs) and natively for cargo test. All randomness (the destructible-block layout) comes from a small seeded PRNG."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
