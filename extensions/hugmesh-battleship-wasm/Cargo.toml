[package]
name = "hugmesh-battleship-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin C-ABI / JSON-over-linear-memory WASM shim around hugmesh-battleship. Compiles to a tiny freestanding wasm32-unknown-unknown module (NOT emscripten, NOT wasi, NO wasm-bindgen) with ZERO host imports, so the browser can run the authoritative Battleship rules via WebAssembly.instantiateStreaming AND a JVM WASM runtime (Chicory) can run it with no JS host. Exports a bump allocator (alloc/dealloc) plus the Game ops (battleship_new/battleship_place/battleship_ready/battleship_fire/battleship_resolve/battleship_snapshot/battleship_status) over a single global Game instance. FOG OF WAR: each client owns its OWN board; the relay carries only a shot coord + its result, never a fleet layout. The core crate is left UNMODIFIED; all JSON marshalling lives here."

[lib]
# cdylib so the build emits a freestanding .wasm. No rlib needed — this crate is
# only ever the wasm entrypoint, never linked into another Rust target.
crate-type = ["cdylib"]

[dependencies]
# A path dependency on the pure rules engine and NOTHING else — keeping the wasm
# module dependency-free (no serde, no wasm-bindgen) so it has no host imports
# and stays tiny. The engine ALREADY emits its own JSON (Game::shot_json /
# Game::snapshot_json / GameStatus::wire); this shim only marshals bytes across
# the linear-memory ABI.
hugmesh-battleship = { path = "../hugmesh-battleship" }

[profile.release]
opt-level = "z"
lto = true
# A single codegen unit lets LTO strip the most dead code from the freestanding
# module; panic=abort drops the unwinding tables the host never needs.
codegen-units = 1
panic = "abort"
