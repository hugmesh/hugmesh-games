[package]
name = "hugmesh-tetris"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party single-player Tetris engine for hugmesh.games. Pure, deterministic, dependency-free. Runs entirely as wasm32 in the browser (no server, no relay) and natively for cargo test. All randomness comes from a small seeded PRNG so every game is reproducible."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
