[package]
name = "hugmesh_bridge"
version = "0.1.0"
edition = "2021"
description = "Reusable Godot GDExtension that translates host-module SSE events into Godot signals (Streaming mode) and falls back to local-input echo (Standalone mode) so Godot IDE local-play works without the BFF running."

[lib]
crate-type = ["cdylib"]

[features]
# godot-rust gates the wasm32-unknown-emscripten target behind an explicit
# opt-in feature ("Wasm target requires opt-in via `experimental-wasm`…").
# We forward it through this crate's default features so a plain
#   cargo build --target wasm32-unknown-emscripten
# Just Works for both `make build-rust` and CI.
default = ["wasm-opt-in"]
wasm-opt-in = ["godot/experimental-wasm"]

# Opt-in: bind against the user's locally-installed Godot binary
# instead of gdext's baked-in `extension_api.json`. Required when
# the user runs a Godot patch release (e.g. 4.6.1) — gdext's
# defaults pin to 4.6 stable and the patch-release method-bind
# hashes don't match, panicking with
#   "Failed to load class method TranslationServer::get_translation_object …
#    Make sure gdext and Godot are compatible".
#
# Enable from the Makefile's native build step (`cargo build --release
# --features api-custom`) AND export GODOT4_BIN=/path/to/godot so
# gdext's build.rs can dump extension_api.json from your runtime.
# Don't use this for the wasm target — the Docker builder has no
# Godot installed and the wasm binding only needs to match the web
# export template (currently 4.6 stable).
api-custom = ["godot/api-custom"]

[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }
# Deterministic game cores reused FROM Godot via the bridge. Each core is a
# pure, dependency-free Rust crate (rlib) that compiles for BOTH the native
# .so (editor F5 / cargo test) and the wasm32-unknown-emscripten bridge build
# that ships in the Web export — so the SAME validated logic runs everywhere.
# A core is reused by exposing a GDExtension node here (see src/chess_engine.rs)
# that the game's GDScript calls; game rules are NEVER reimplemented in GDScript.
hugmesh-chess = { path = "../hugmesh-chess" }
# Connect Four — the first turn-based port after chess. Same reuse shape: the
# pure `hugmesh-connect-four` rules engine (rlib) is linked here and wrapped
# by the ConnectFourEngine GDExtension node (src/connect_four_engine.rs). No
# GDScript reimplements the rules; the web-native bundle keeps driving the SAME
# core through its wasm C-ABI shim (hugmesh-connect-four-wasm).
hugmesh-connect-four = { path = "../hugmesh-connect-four" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Native target (Linux/Windows/macOS) uses the default panic=unwind so
# godot-rust's master-branch compatibility panics on Godot 4.6 are
# CAUGHT by the runtime — the .so loads with reduced functionality
# instead of aborting the whole godot process during export. The
# wasm32-unknown-emscripten target NEEDS panic=abort to avoid emitting
# the `__cpp_exception` tag (Godot's web template doesn't supply it);
# that override lives in `.cargo/config.toml` as a target-specific
# rustflag.

[profile.dev]
opt-level = 0
