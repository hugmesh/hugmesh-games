[package]
name = "hugmesh-tetris-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin C-ABI / JSON-over-linear-memory WASM shim around hugmesh-tetris. Compiles to a tiny freestanding wasm32-unknown-unknown module (NOT emscripten, NOT wasi, NO wasm-bindgen) with ZERO host imports, so the browser can run the deterministic, seed-based single-player Tetris engine via WebAssembly.instantiateStreaming AND a JVM WASM runtime (Chicory) can run it with no JS host. Exports a bump allocator (alloc/dealloc) plus the Game ops (tetris_new / tetris_left / tetris_right / tetris_rotate_cw / tetris_rotate_ccw / tetris_soft_drop / tetris_hard_drop / tetris_hold / tetris_tick / tetris_snapshot / tetris_status / tetris_filled) over a SINGLE global Game instance. The core crate is left UNMODIFIED; all JSON marshalling lives here. SINGLE-PLAYER PUZZLE: local-only, the server is never involved."

[lib]
# cdylib so the build emits a freestanding .wasm. No rlib needed — this crate is
# only ever the wasm entrypoint, never linked into another Rust target.
crate-type = ["cdylib"]

[dependencies]
# A path dependency on the pure puzzle engine and NOTHING else — keeping the wasm
# module dependency-free (no serde, no wasm-bindgen) so it has no host imports and
# stays tiny. The engine ALREADY emits its own JSON (Game::to_json / snapshot()
# and GameStatus::wire); this shim only marshals bytes across the linear-memory
# ABI and synthesises the two tiny status/error shapes the shim itself owns.
hugmesh-tetris = { path = "../hugmesh-tetris" }

[profile.release]
opt-level = "z"
lto = true
# A single codegen unit lets LTO strip the most dead code from the freestanding
# module; panic=abort drops the unwinding tables the host never needs.
codegen-units = 1
panic = "abort"
