[package]
name = "snapdragon-sudoku-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin C-ABI / JSON-over-linear-memory WASM shim around snapdragon-sudoku. Compiles to a tiny freestanding wasm32-unknown-unknown module (NOT emscripten, NOT wasi, NO wasm-bindgen) with ZERO host imports, so the browser can run the authoritative single-player Sudoku rules via WebAssembly.instantiateStreaming. Exports a bump allocator (alloc/dealloc) plus the Game ops (sudoku_new/sudoku_from_str/sudoku_place/sudoku_clear/sudoku_state/sudoku_status/sudoku_hint/sudoku_is_given) over a single global Game instance. The core crate is left UNMODIFIED; all JSON marshalling lives here and reuses the engine's OWN sudoku.snapshot wire shape."

[lib]
# cdylib so the build emits a freestanding .wasm. No rlib needed — this crate is
# only ever the wasm entrypoint, never linked into another Rust target.
crate-type = ["cdylib"]

[dependencies]
# A path dependency on the pure rules engine and NOTHING else — keeping the wasm
# module dependency-free (no serde, no wasm-bindgen) so it has no host imports
# and stays tiny. The engine ALREADY emits its own JSON (Game::to_json /
# GameStatus::wire); this shim only marshals bytes across the linear-memory ABI
# and reuses those EXISTING wire shapes verbatim.
snapdragon-sudoku = { path = "../snapdragon-sudoku" }

[profile.release]
opt-level = "z"
lto = true
# A single codegen unit lets LTO strip the most dead code from the freestanding
# module; panic=abort drops the unwinding tables the host never needs.
codegen-units = 1
panic = "abort"
