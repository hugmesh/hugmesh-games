[package]
name = "snapdragon-fps-core-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Thin C-ABI / JSON-over-linear-memory WASM shim around snapdragon-fps-core. Compiles to a tiny freestanding wasm32-unknown-unknown module (NOT emscripten, NOT wasi, NO wasm-bindgen) with ZERO host imports, so a JVM WASM runtime (Chicory) can run the authoritative FPS sim with no JS host. Exports a bump allocator (alloc/dealloc) plus the SimCore ops (fps_new/fps_step/fps_snapshot/fps_is_terminal/fps_result/fps_restore) over a single global match instance. The core crate is left UNMODIFIED; all JSON marshalling lives here."

[lib]
# cdylib so the build emits a freestanding .wasm. No rlib needed — this crate is
# only ever the wasm entrypoint, never linked into another Rust target.
crate-type = ["cdylib"]

[dependencies]
# A path dependency on the pure sim core and NOTHING else — keeping the wasm
# module dependency-free (no serde, no wasm-bindgen) so it has no host imports
# and stays tiny. All JSON parse/encode is hand-rolled in src/lib.rs.
snapdragon-fps-core = { path = "../snapdragon-fps-core" }

[profile.release]
opt-level = "z"
lto = true
# A single codegen unit lets LTO strip the most dead code from the freestanding
# module; panic=abort drops the unwinding tables the JVM host never needs.
codegen-units = 1
panic = "abort"
