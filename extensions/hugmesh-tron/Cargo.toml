[package]
name = "hugmesh-tron"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "First-party two-player Tron light-cycles engine for hugmesh.games. Pure, deterministic, dependency-free real-time tick simulation. Host-authoritative: it compiles to wasm32 and runs in the browser, the server only streams inputs and the guest re-simulates each tick to re-validate. A fixed timestep advances both cycles SIMULTANEOUSLY per tick from a seeded layout, so the same seed + same input sequence always reproduces the same outcome bit-for-bit. See docs/multiplayer-chess-design.md."

[lib]
# rlib for `cargo test`; cdylib for the wasm/ffi build that ships to the browser.
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
