server {
    # Web port is 8080 across the project (compose, dev, e2e).
    # The api service runs on its own internal :8080 inside the compose
    # network — this nginx proxies /api/* to it.
    listen 8080;
    listen [::]:8080;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: never buffer the response; chunk straight through.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
