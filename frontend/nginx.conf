server {
    # Web port is 8080 across the project (compose, dev, e2e).
    # The api service runs on its own internal :8080 inside the compose
    # network — this nginx proxies /api/* to it.
    listen 8080;
    listen [::]:8080;

    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation. Once
    # Godot bundles are mounted directly in Angular (no iframe — see
    # docs/PLAN-module-federation-and-native.md section A) the SPA shell
    # itself must serve these. Same pair already lives in angular.json
    # `serve.headers` for the `ng serve` dev path.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: never buffer the response; chunk straight through.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
