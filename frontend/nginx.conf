server {
    # Web port is 8080 across the project (compose, dev, e2e).
    # The api service runs on its own internal :8080 inside the compose
    # network — this nginx proxies /api/* to it.
    listen 8080;
    listen [::]:8080;

    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation. Once
    # Godot bundles are mounted directly in Angular (no iframe — see
    # docs/PLAN-module-federation-and-native.md section A) the SPA shell
    # itself must serve these. Same pair already lives in angular.json
    # `serve.headers` for the `ng serve` dev path.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: never buffer the response; chunk straight through.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ── Federated remotes ────────────────────────────────────────────────
    # Each /_remotes/<slug>/ maps to the matching compose service's nginx
    # so all browser traffic stays on a single origin (same COOP/COEP,
    # same TLS termination, no CORS gymnastics). The federation_modules
    # table's remote_entry_url uses these relative paths.
    location /_remotes/games-dodecahedron/ {
        proxy_pass http://games-dodecahedron:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/games-three-wizards/ {
        proxy_pass http://games-three-wizards:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/login/ {
        proxy_pass http://login:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/admin/ {
        proxy_pass http://admin:8080/;
        proxy_set_header Host $host;
    }
    # api-docs: navigator-style federated remote with three exposed
    # modules — DocsShell (root), ApiExplorer, ApiReference.
    # Mounted at /admin/docs in the host shell.
    location /_remotes/api-docs/ {
        proxy_pass http://api-docs:8080/;
        proxy_set_header Host $host;
    }
    # /docs/api/openapi.json — merged OpenAPI spec produced by the
    # docs publishing pipeline. Bind-mounted into this nginx by the
    # frontend Dockerfile (or an init container in compose) so the
    # api-docs explorer can fetch it at /docs/api/openapi.json without
    # going through the BFF.
    location /docs/ {
        alias /usr/share/nginx/docs/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
    # wasm-fragment serves Godot bundles as same-origin iframe content.
    # The upstream sets COOP/COEP/CORP itself; suppress duplicates from
    # the host's server-level add_header so the response carries one
    # canonical set of cross-origin headers (Chromium can be picky about
    # duplicate enforcement headers when they originate from different
    # nginx phases).
    location /_remotes/wasm-fragment/ {
        proxy_pass http://wasm-fragment:8080/;
        proxy_set_header Host $host;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
