# ── Per-IP rate-limit zones (sized for ~10 000 concurrent users) ──
# limit_req_zone is an http-level directive; nginx wraps each
# /etc/nginx/conf.d/*.conf in its default http{} block, so these
# declarations belong here (above the server{} block).
#
# Memory math: 10 MB of shared memory holds ~160 000 unique IPs in a
# limit_req zone (≈64 B per entry). The zones below are sized for an
# audience of about 10 000 concurrent humans behind ~20 NAT'd egress
# IPs each — i.e. ~200 000 distinct IPs in the worst case. We round
# up to 16 MB per zone so a Slashdot moment doesn't fall off the
# tracker.
#
#   tier            req/s   burst  use case
#   ------------    -----   -----  --------------------------------
#   browse          100     200    home / catalog / static assets
#   api             50      150    /api/* JSON traffic
#   sse             30      100    /api/game/stream (long-lived;
#                                   most of its quota is the open
#                                   keep-alive, not new requests)
#   auth            5       20     /api/auth/* (token mint + refresh
#                                   probes; one legitimate login fires
#                                   several requests in the same second
#                                   when the federation manifest pulls
#                                   in the login remote in parallel,
#                                   so 1 r/s here locks out real users)
#   admin           5       20     /api/admin/* (writes, scope mods)
#   maker_api       10      40     /api/rpg/* + /api/vn/* (publisher
#                                   editors; expected lower volume
#                                   than browse but bursty during
#                                   build polls)
#
# delay=N inside `limit_req` smooths bursts instead of 503'ing —
# the request queues for up to N over-limit slots before failing.
# `nodelay` rejects immediately, which is what we want for auth.
limit_req_zone $binary_remote_addr zone=browse:16m    rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:16m       rate=50r/s;
limit_req_zone $binary_remote_addr zone=sse:16m       rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:8m       rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin:8m      rate=5r/s;
limit_req_zone $binary_remote_addr zone=maker_api:8m  rate=10r/s;

# Concurrent-connection cap per IP — backstops the per-second
# rate-limit by refusing a 10 001st parallel connection from one
# source even if each request is well under the rate cap. Set high
# enough that a normal browser's 6 parallel sockets + a few in-
# flight SSE streams fit comfortably.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:8m;

# When a client trips a zone, return 429 (Too Many Requests) so
# clients with backoff logic do the right thing. nginx defaults to
# 503 which most browsers don't retry.
limit_req_status 429;
limit_conn_status 429;

server {
    # Web port is 8080 across the project (compose, dev, e2e).
    # The api service runs on its own internal :8080 inside the compose
    # network — this nginx proxies /api/* to it.
    listen 8080;
    listen [::]:8080;

    # Cap simultaneous connections per source IP — 40 covers a
    # browser's parallel fetches + a couple of SSE streams + the
    # api-docs explorer with room to spare.
    limit_conn conn_per_ip 40;

    root /usr/share/nginx/html;
    index index.html;

    # ── Hardening (OWASP-recommended response headers) ──────────────
    # SharedArrayBuffer + threaded WASM need cross-origin isolation.
    # The COOP/COEP pair was previously the only thing here; rest of
    # the OWASP set follows so the host shell + every static asset
    # ships with the same posture.
    server_tokens off;
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-site"    always;
    add_header Strict-Transport-Security    "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options       "nosniff"      always;
    add_header X-Frame-Options              "DENY"         always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    # Permissions-Policy: opt out of every browser feature the SPA
    # doesn't need so a future XSS can't enable a camera prompt.
    # autoplay=(self) keeps the WASM bundles' audio working;
    # fullscreen=(self) keeps the host's fullscreen toolbar working.
    add_header Permissions-Policy
        "accelerometer=(), ambient-light-sensor=(), autoplay=(self), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(self), gamepad=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
        always;

    location / {
        # Browse rate-limit applies to the SPA shell + static assets.
        # `delay=100` queues bursts up to that count instead of 429ing
        # — typical for a page-navigation flurry that bursts fetches.
        limit_req zone=browse burst=200 delay=100;
        try_files $uri $uri/ /index.html;
    }

    # Side service: rpg-builder. Mounted under /api/rpg/ so the
    # federated games-rpg-maker remote can talk to it via same-origin
    # URLs (forwards the JWT cookie / Bearer header transparently).
    # Listed BEFORE /api/ so the more-specific prefix wins.
    location /api/rpg/ {
        limit_req zone=maker_api burst=40 delay=20;
        proxy_pass http://rpg-builder:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Build status polls + asset POSTs need long timeouts.
        proxy_read_timeout 300s;
    }
    # Side service: vn-builder. Same shape as rpg-builder.
    location /api/vn/ {
        limit_req zone=maker_api burst=40 delay=20;
        proxy_pass http://vn-builder:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Auth + admin paths get tighter zones — credential-stuffing or
    # admin-action abuse blow back faster. The BFF's existing
    # RateLimitFilter still runs at the controller level (with a
    # cross-pod Cassandra aggregator); these zones are the first
    # line of defence at the edge.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # SSE stream — long-lived; loose burst so the open keep-alive
    # doesn't get clipped, but the rate cap still bounds a
    # reconnect-storm.
    location /api/game/stream {
        limit_req zone=sse burst=100 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=api burst=150 delay=50;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: never buffer the response; chunk straight through.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ── Federated remotes ────────────────────────────────────────────────
    # Each /_remotes/<slug>/ maps to the matching compose service's nginx
    # so all browser traffic stays on a single origin (same COOP/COEP,
    # same TLS termination, no CORS gymnastics). The federation_modules
    # table's remote_entry_url uses these relative paths.
    location /_remotes/games-dodecahedron/ {
        proxy_pass http://games-dodecahedron:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/games-three-wizards/ {
        proxy_pass http://games-three-wizards:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/login/ {
        proxy_pass http://login:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/admin/ {
        proxy_pass http://admin:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/mod/ {
        proxy_pass http://mod:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/publisher/ {
        proxy_pass http://publisher:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/games-rpg-maker/ {
        proxy_pass http://games-rpg-maker:8080/;
        proxy_set_header Host $host;
    }
    location /_remotes/games-vn-maker/ {
        proxy_pass http://games-vn-maker:8080/;
        proxy_set_header Host $host;
    }
    # api-docs: navigator-style federated remote with three exposed
    # modules — DocsShell (root), ApiExplorer, ApiReference.
    # Mounted at /admin/docs in the host shell.
    location /_remotes/api-docs/ {
        proxy_pass http://api-docs:8080/;
        proxy_set_header Host $host;
    }
    # /docs/api/openapi.json — merged OpenAPI spec produced by the
    # docs publishing pipeline. Bind-mounted into this nginx by the
    # frontend Dockerfile (or an init container in compose) so the
    # api-docs explorer can fetch it at /docs/api/openapi.json without
    # going through the BFF.
    location /docs/ {
        alias /usr/share/nginx/docs/;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
    # wasm-fragment serves Godot bundles as same-origin iframe content.
    # The upstream sets COOP/COEP/CORP itself; suppress duplicates from
    # the host's server-level add_header so the response carries one
    # canonical set of cross-origin headers (Chromium can be picky about
    # duplicate enforcement headers when they originate from different
    # nginx phases).
    location /_remotes/wasm-fragment/ {
        proxy_pass http://wasm-fragment:8080/;
        proxy_set_header Host $host;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
