# nginx config used by `make e2e`. Same logical layout as nginx.conf but
# wrapped in TLS — listens HTTPS on :8443 with the self-signed server cert
# from scripts/gen-certs.sh, and redirects plain :8080 → :8443.
#
# Mirror nginx.conf's rate-limit zones line-for-line so the e2e TLS
# environment carries the same posture as the plain-HTTP listener.
# See nginx.conf for the rationale + sizing rationale.

limit_req_zone $binary_remote_addr zone=browse:16m    rate=100r/s;
limit_req_zone $binary_remote_addr zone=api:16m       rate=50r/s;
limit_req_zone $binary_remote_addr zone=sse:16m       rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:8m       rate=5r/s;
limit_req_zone $binary_remote_addr zone=admin:8m      rate=5r/s;
limit_req_zone $binary_remote_addr zone=maker_api:8m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:8m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + WebAssembly threading requires the page to be
    # cross-origin-isolated. Once we host Godot WASM directly inside Angular
    # (no iframe — see docs/PLAN-module-federation-and-native.md section A)
    # these headers must apply to the SPA shell, not just the iframe doc.
    # Setting them at the server level covers the index.html plus every
    # game bundle served from /api/assets/levels/*. Same pair already lives
    # in angular.json `serve.headers` for `ng serve`.
    add_header Cross-Origin-Opener-Policy   "same-origin"     always;
    add_header Cross-Origin-Embedder-Policy "require-corp"    always;

    limit_conn conn_per_ip 40;

    location / {
        limit_req zone=browse burst=200 delay=100;
        try_files $uri $uri/ /index.html;
    }

    # Side service: rpg-builder. Listed BEFORE /api/ so the more-
    # specific prefix wins when an editor calls /api/rpg/projects/...
    location /api/rpg/ {
        limit_req zone=maker_api burst=40 delay=20;
        proxy_pass http://rpg-builder:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location /api/vn/ {
        limit_req zone=maker_api burst=40 delay=20;
        proxy_pass http://vn-builder:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Auth + admin paths get tighter zones — see nginx.conf for the
    # rationale.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/admin/ {
        limit_req zone=admin burst=20 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/game/stream {
        limit_req zone=sse burst=100 nodelay;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location /api/ {
        limit_req zone=api burst=150 delay=50;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Federated remote proxies — must mirror nginx.conf line-for-line.
    # The plain-HTTP variant added publisher / mod / api-docs blocks
    # post-launch but this TLS overlay stayed minimal, so e2e through
    # this listener silently 404s any unlisted remote (host shell shows
    # "Couldn't reach <X> — federated module didn't load"). Keep these
    # in lockstep with frontend/nginx.conf or maker e2e regresses.
    location /_remotes/games-dodecahedron/ { proxy_pass http://games-dodecahedron:8080/; proxy_set_header Host $host; }
    location /_remotes/games-three-wizards/ { proxy_pass http://games-three-wizards:8080/; proxy_set_header Host $host; }
    location /_remotes/games-rpg-maker/      { proxy_pass http://games-rpg-maker:8080/;   proxy_set_header Host $host; }
    location /_remotes/games-vn-maker/       { proxy_pass http://games-vn-maker:8080/;    proxy_set_header Host $host; }
    location /_remotes/login/                { proxy_pass http://login:8080/;             proxy_set_header Host $host; }
    location /_remotes/registration/         { proxy_pass http://registration:8080/;      proxy_set_header Host $host; }
    location /_remotes/producer-registration/ { proxy_pass http://producer-registration:8080/; proxy_set_header Host $host; }
    location /_remotes/banned/               { proxy_pass http://banned:8080/;            proxy_set_header Host $host; }
    location /_remotes/admin/                { proxy_pass http://admin:8080/;             proxy_set_header Host $host; }
    location /_remotes/mod/                  { proxy_pass http://mod:8080/;               proxy_set_header Host $host; }
    location /_remotes/publisher/            { proxy_pass http://publisher:8080/;         proxy_set_header Host $host; }
    location /_remotes/api-docs/             { proxy_pass http://api-docs:8080/;          proxy_set_header Host $host; }

    # wasm-fragment serves Godot bundles as same-origin iframe content.
    # The upstream sets COOP/COEP/CORP itself; suppress duplicates from
    # the host's server-level add_header so the response carries one
    # canonical set of cross-origin headers (Chromium can be picky about
    # duplicate enforcement headers when they originate from different
    # nginx phases).
    location /_remotes/wasm-fragment/        {
        proxy_pass http://wasm-fragment:8080/;
        proxy_set_header Host $host;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Embedder-Policy;
        # Re-emit only inside this location so server-block adds don't
        # double them. `always` matches any status.
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
