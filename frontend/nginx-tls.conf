# nginx config used by `make e2e`. Same logical layout as nginx.conf but
# wrapped in TLS — listens HTTPS on :8443 with the self-signed server cert
# from scripts/gen-certs.sh, and redirects plain :8080 → :8443.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    return 301 https://$host:8080$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;

    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + WebAssembly threading requires the page to be
    # cross-origin-isolated. Once we host Godot WASM directly inside Angular
    # (no iframe — see docs/PLAN-module-federation-and-native.md section A)
    # these headers must apply to the SPA shell, not just the iframe doc.
    # Setting them at the server level covers the index.html plus every
    # game bundle served from /api/assets/levels/*. Same pair already lives
    # in angular.json `serve.headers` for `ng serve`.
    add_header Cross-Origin-Opener-Policy   "same-origin"     always;
    add_header Cross-Origin-Embedder-Policy "require-corp"    always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Federated remote proxies (mirrors nginx.conf).
    location /_remotes/games-dodecahedron/ { proxy_pass http://games-dodecahedron:8080/; proxy_set_header Host $host; }
    location /_remotes/games-three-wizards/ { proxy_pass http://games-three-wizards:8080/; proxy_set_header Host $host; }
    location /_remotes/login/                { proxy_pass http://login:8080/;             proxy_set_header Host $host; }
    location /_remotes/admin/                { proxy_pass http://admin:8080/;             proxy_set_header Host $host; }
    location /_remotes/wasm-fragment/        { proxy_pass http://wasm-fragment:8080/;     proxy_set_header Host $host; }
}
