server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin  "*"             always;

    # The native-federation builder produces remoteEntry.json at the
    # bundle root + every shared dep + the exposed module. Just serve
    # the dist as static files; the federation runtime resolves
    # everything by URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
