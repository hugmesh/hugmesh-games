server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer + threaded WASM need cross-origin isolation.
    # Match the host SPA's headers so the remote can run Godot WASM
    # in the same threading mode as the legacy iframe path.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # Federation runtime expects to dynamic-import remote modules from
    # a different origin; allow it.
    add_header Access-Control-Allow-Origin  "*"             always;

    # `remoteEntry.json` is the federation contract. Even without full
    # native-federation, exposing this file lets the host's discovery
    # path see "yes, this remote is real, here's its main bundle".
    location = /remoteEntry.json {
        default_type application/json;
        return 200 '{"name":"games-dodecahedron","exposes":[{"key":"./GameRoot","outFileName":"main.js"}],"shared":[],"native_federation":false}';
    }

    # main-<hash>.js is the entry produced by `ng build games-dodecahedron`.
    # The hash changes per build; route any main-*.js to the served file.
    location / {
        try_files $uri /index.html;
    }
}
