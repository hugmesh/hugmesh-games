server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer/threaded WASM aren't required for login but
    # keep COOP/COEP consistent with the host so the federation
    # bundle origin doesn't surprise downstream usages.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin  "*"             always;

    # Static-serve the entire dist; the federation runtime resolves
    # remoteEntry.json + the exposed module + shared deps by URL.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
