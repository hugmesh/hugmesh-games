<div class="login-page">
  <div class="login-card">
    <div class="logo-area">
      <div class="logo-icon">&#9878;</div>
    </div>
    <h1 class="game-title">Snapdragon<br><span>Games</span></h1>
    <p class="subtitle">Sign in to enter the portal</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="field">
        <input
          formControlName="username"
          type="text"
          placeholder="Username"
          class="input"
          autocomplete="username">
      </div>
      <div class="field">
        <input
          formControlName="password"
          type="password"
          placeholder="Password"
          class="input"
          autocomplete="current-password">
      </div>

      @if (error) {
        <p class="error-msg">{{ error }}</p>
      }

      <button type="submit" class="login-btn" [disabled]="form.invalid || loading">
        @if (loading) {
          <span class="btn-icon">&#8987;</span>
          Signing in&hellip;
        } @else {
          <span class="btn-icon">&#128481;</span>
          Sign In
        }
      </button>
    </form>

    <p class="login-note">A JRPG game portal. Up to 3 players, one controller.</p>
  </div>
</div>
