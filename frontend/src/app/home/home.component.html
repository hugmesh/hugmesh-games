<div class="home">

  <section class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">Three Wizards<br><span>In A Trenchcoat</span></h1>
      <p class="hero-sub">Choose your adventure</p>
    </div>
  </section>

  <section class="game-grid-section">
    <h2 class="section-label">Games</h2>
    <div class="game-grid">
      @for (game of games$ | async; track game.id) {
        <div class="game-card" (click)="selectGame(game)" [class.active]="activeGame?.id === game.id">
          <div class="card-thumb">
            <div class="card-thumb-placeholder">
              <span class="thumb-icon">⚔️</span>
            </div>
          </div>
          <div class="card-body">
            <h3 class="card-title">{{ game.name }}</h3>
            <p class="card-desc">{{ game.description }}</p>
            <button class="play-btn" (click)="selectGame(game); $event.stopPropagation()">▶ Play</button>
          </div>
        </div>
      }
      @if ((games$ | async)?.length === 0) {
        <p class="empty-state">No games available — make sure the API is running.</p>
      }
    </div>
  </section>

  @if (activeGame) {
    <section class="canvas-section" #canvasSection>
      <div class="canvas-header">
        <span class="canvas-title">{{ activeGame.name }}</span>
        <div class="canvas-actions">
          <button class="icon-btn" (click)="toggleFullscreen()" title="Fullscreen">
            {{ isFullscreen ? '⛶' : '⛶' }} {{ isFullscreen ? 'Exit Fullscreen' : 'Fullscreen' }}
          </button>
          <button class="icon-btn close-btn" (click)="closeGame()" title="Close">✕ Close</button>
        </div>
      </div>
      <div class="canvas-container" #canvasContainer>
        <app-game-canvas [gameId]="activeGame.id"></app-game-canvas>
        <div class="hud-layer">
          <app-game-hud></app-game-hud>
          <app-game-controls></app-game-controls>
        </div>
      </div>
    </section>
  }

</div>
