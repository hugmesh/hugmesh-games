<!-- Movement D-pad — bottom-left, always positioned outside the document flow
so it sits beneath the HP/MP HUD bars instead of stacking under them. -->
<div class="dpad-cluster" [class.hidden]="!dpadVisible">
  <button class="dpad-toggle"
    (click)="toggleDpad()"
    [attr.title]="(dpadVisible ? 'Hide' : 'Show') + ' on-screen controls'">
    {{ dpadVisible ? '⌄' : '⌃' }}
  </button>

  <div class="dpad-row dpad-top">
    @for (btn of movementButtons.slice(0,1); track btn) {
      <button
        class="ctrl-btn dpad-btn"
        [class.pressed]="btn.pressed"
        [attr.title]="btn.label + ' [' + btn.key.toUpperCase() + ']'"
        (mousedown)="onButtonDown(btn)"
        (mouseup)="onButtonUp(btn)"
        (mouseleave)="onButtonUp(btn)"
        (touchstart)="onButtonDown(btn)"
        (touchend)="onButtonUp(btn)">
        <span class="btn-icon">{{ btn.icon }}</span>
        <span class="btn-key">{{ btn.key.toUpperCase() }}</span>
      </button>
    }
  </div>
  <div class="dpad-row dpad-middle">
    @for (btn of movementButtons.slice(1,4); track btn) {
      <button
        class="ctrl-btn dpad-btn"
        [class.pressed]="btn.pressed"
        [attr.title]="btn.label + ' [' + btn.key.toUpperCase() + ']'"
        (mousedown)="onButtonDown(btn)"
        (mouseup)="onButtonUp(btn)"
        (mouseleave)="onButtonUp(btn)"
        (touchstart)="onButtonDown(btn)"
        (touchend)="onButtonUp(btn)">
        <span class="btn-icon">{{ btn.icon }}</span>
        <span class="btn-key">{{ btn.key.toUpperCase() }}</span>
      </button>
    }
  </div>
  <div class="dpad-row dpad-bottom">
    @for (btn of movementButtons.slice(4); track btn) {
      <button
        class="ctrl-btn jump-btn"
        [class.pressed]="btn.pressed"
        [attr.title]="btn.label + ' [Space]'"
        (mousedown)="onButtonDown(btn)"
        (mouseup)="onButtonUp(btn)"
        (mouseleave)="onButtonUp(btn)"
        (touchstart)="onButtonDown(btn)"
        (touchend)="onButtonUp(btn)">
        <span class="btn-icon">{{ btn.icon }}</span>
        <span class="btn-key">SPACE</span>
      </button>
    }
  </div>
</div>

<!-- Persistent edge-tab to bring the dpad back when hidden. Always rendered. -->
@if (!dpadVisible) {
  <button
    class="dpad-show-tab"
    (click)="toggleDpad()"
    title="Show on-screen controls">
    ⌃ Controls
  </button>
}

<!-- Bottom-center hotbar: 5 spells + 1 quick item -->
<div class="hotbar">
  @for (s of spellSlots; track s) {
    <button
      class="hotbar-slot spell-slot"
      [attr.title]="(s.name ?? 'Empty') + (s.name ? ' — ' + s.manaCost + ' MP' : '') + ' [' + s.slot + ']'"
      (click)="onSpellClick(s)">
      <span class="slot-icon">{{ s.icon }}</span>
      <span class="slot-key">{{ s.slot }}</span>
      @if (s.name) {
        <span class="slot-mana">{{ s.manaCost }}</span>
      }
    </button>
  }

  <div class="hotbar-divider"></div>

  <button
    class="hotbar-slot item-slot"
    [class.empty]="!itemSlot.name"
    [class.pressed]="interactBtn.pressed"
    [attr.title]="(itemSlot.name ?? 'No item') + ' [E]'"
    (click)="onItemClick()">
    <span class="slot-icon">{{ itemSlot.icon }}</span>
    <span class="slot-key">E</span>
    @if (itemSlot.quantity > 0) {
      <span class="slot-count">×{{ itemSlot.quantity }}</span>
    }
  </button>
</div>
