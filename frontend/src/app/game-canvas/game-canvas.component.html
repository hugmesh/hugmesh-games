<div class="canvas-wrapper">
  <iframe
    #gameFrame
    class="game-frame"
    [src]="frameSrc"
    title="Three Wizards In A Trenchcoat"
    allow="fullscreen; pointer-lock; autoplay"
    (load)="onFrameLoad()"
  ></iframe>
  @if (!gameLoaded) {
    <div class="loading-overlay">
      <div class="loading-spinner"></div>
      <span>Loading...</span>
    </div>
  }
</div>
