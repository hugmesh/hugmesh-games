<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snapdragon Games</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <!--
    Native federation emits ESM imports of bare module specifiers
    (@angular/core, rxjs, ...) that the browser can only resolve
    through an import map. The federation builder generates that
    map but the browser still needs es-module-shims to apply it
    via shimMode (the federation builder emits
    <script type="module-shim">). Vendored locally so the e2e
    container — which can't reach external CDNs — still gets the
    shim, and so it's loaded SYNCHRONOUSLY before the federated
    bundle scripts run.
  -->
  <script type="esms-options">{ "shimMode": true }</script>
  <script src="assets/es-module-shims.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
