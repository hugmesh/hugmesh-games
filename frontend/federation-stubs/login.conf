server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # Federation remote contract: /remoteEntry.json describes the
    # exposed modules. The stub returns an empty list so the host
    # federation runtime resolves successfully and skips this remote
    # until a real build replaces the stub.
    location = /remoteEntry.json {
        default_type application/json;
        return 200 '{"name":"login","exposes":[],"shared":[],"stub":true}';
    }

    location / { try_files $uri /index.html; }
}
