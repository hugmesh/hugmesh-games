server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    location = /remoteEntry.json {
        default_type application/json;
        return 200 '{"name":"admin","exposes":[],"shared":[],"stub":true}';
    }

    location / { try_files $uri /index.html; }
}
