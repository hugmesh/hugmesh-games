server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # The shared WASM fragment is contacted by parent game remotes with
    # a `?slug=<game>&level=<n>` query string. It rewrites that query
    # to the BFF's authoritative asset path so the federation seam
    # stays at this nginx (one host header, one COOP/COEP, one TLS
    # termination); the bytes still come from the api service. The
    # `level` param is currently informational — every level under a
    # given slug shares the same Godot bundle today, but we keep the
    # param in the contract so per-level bundles can come online
    # without a federation_modules schema change.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Access-Control-Allow-Origin  "*"             always;

    # Capture the slug query param. nginx exposes $arg_<name> for any
    # query string parameter. Empty fallback prevents an open redirect
    # if a caller forgets the param.
    location = /fragment {
        if ($arg_slug = "") { return 400 'wasm-fragment: missing ?slug='; }
        return 302 /api/assets/levels/$arg_slug/index.html;
    }

    # Reachable inside compose so docs/preview tools can hit / for a
    # quick sanity check. Browser clients always go through /fragment
    # via the host's /_remotes/wasm-fragment/ proxy.
    location / { try_files $uri /index.html; }
}
