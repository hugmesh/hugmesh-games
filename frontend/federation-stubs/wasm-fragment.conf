server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /usr/share/nginx/html;
    index index.html;

    # The shared WASM fragment is contacted by parent game remotes with
    # a `?slug=<game>&level=<n>` query string. In production it serves
    # the matching Godot bundle (wasm/pck/js) with COOP/COEP set so
    # SharedArrayBuffer + threaded WASM work. Stubbed to a 200 OK
    # placeholder until the real fragment image lands.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location = /fragment {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>wasm-fragment stub</title><body><h1>wasm-fragment stub</h1><p>Will serve <code>?slug=&amp;level=</code>-routed Godot bundles once the real image is built.</p></body>';
    }

    location / { try_files $uri /index.html; }
}
