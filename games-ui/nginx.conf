# Per-response CSP nonce source. nginx has no built-in random function, so we
# reuse $request_id (a unique 32-hex-char token generated fresh for EVERY
# request): unguessable and different per response, which is exactly what a
# nonce needs to be. The `map` exposes it as $cspnonce so the sub_filter rewrite
# and the Content-Security-Policy header below always emit the SAME value.
#
# Defined at http scope, which is legal here because the Dockerfile installs
# this file as `/etc/nginx/conf.d/default.conf` — conf.d/* is `include`d from
# INSIDE the http block of the stock nginx.conf.
map $request_id $cspnonce {
    default $request_id;
}

server {
    # nginx-unprivileged: :8080, uid 101 (matches federation-api changeset 025
    # remote_entry_url http://hugmesh-games-ui:8080/remoteEntry.json).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: this remote is loaded by the host shell via
    #     <script> (native federation), NOT via <iframe>. The game BUNDLES this
    #     remote iframes are served by the wasm-fragment tier under its own
    #     frame-ancestors 'self' policy, not by this nginx.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Content-Security-Policy (strong, nonce-based XSS backstop) ────────────
    # WHY THIS EXISTS AT ALL: the TLS front door (hugmesh-gateway SecurityConfig)
    # applies a blanket fallback CSP — `default-src 'self'; script-src 'self'; …`
    # — to any upstream that sends NO CSP of its own. Angular native-federation
    # ships an INLINE `<script type="esms-options">` in index.html and loads the
    # bundle as `type="module-shim"`; under a bare `script-src 'self'` that inline
    # script is blocked, es-module-shims is never configured, the module-shim
    # bundle never runs and Angular NEVER BOOTSTRAPS — <hug-games-root> stays
    # empty and the page renders blank with no server error. Sending our own
    # nonce'd policy here wins over the gateway fallback.
    #
    # There is NO 'unsafe-inline' / 'unsafe-hashes' in script-src — only the
    # per-response nonce. The sub_filter below rewrites every '<script' in
    # index.html to carry nonce="$cspnonce", and es-module-shims auto-propagates
    # that nonce to the module scripts it injects.
    #
    # Directives are TUNED to what this UI actually does:
    #   - script-src 'self' 'nonce-$cspnonce' blob:   : only nonce'd same-origin
    #       scripts run; blob: is for the module URLs es-module-shims mints while
    #       shimming imports (REQUIRED, not precautionary).
    #   - style-src 'self' 'unsafe-inline' blob:      : Angular injects component
    #       styles as runtime <style> elements (not nonce-able); es-module-shims
    #       also fetches a stylesheet from a blob: URL.
    #   - img-src 'self' data:                         : game thumbnails are
    #       same-origin (catalog thumbnailUrl or the bundle's own icon under
    #       /_remotes/wasm-fragment/<slug>/); data: for nothing today, kept for
    #       the letter-tile fallback should it ever become an inline image.
    #   - connect-src 'self' blob:                     : every XHR is same-origin
    #       /games/api/** (cookie auth); the admin live-session terminal is a
    #       same-origin EventSource; blob: for es-module-shims' fetches.
    #   - worker-src 'self' blob:, media-src 'self' blob: : this UI creates no
    #       workers and plays no media itself, but the policy is stated
    #       explicitly per the games remote contract so a future bundle-side
    #       need cannot silently inherit script-src's fallback.
    #   - frame-src 'self'                             : the Play screen iframes
    #       /_remotes/wasm-fragment/<slug>/index.html on the SAME origin (via the
    #       fe-gateway). The new-tab bundles are opened top-level, not framed.
    #   - base-uri 'self', object-src 'none', frame-ancestors 'none'.
    #
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # in the block that actually serves index.html (where XSS would run).

    # Runtime theme (fleet 50-hug-theme.sh mechanism): served from /tmp — the
    # entrypoint hook's HUG_THEME_OUT — via an exact-match alias, so the SPA
    # catch-all can never shadow it and an empty theme is a zero-byte 200
    # (shipped brand), never an index.html masquerading as a stylesheet.
    # no-store: a rebrand is env + restart; a cached copy would pin the brand.
    # Both names are served (the hook writes both files byte-for-byte).
    location = /snap-theme.css {
        alias /tmp/snap-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /hug-theme.css {
        alias /tmp/hug-theme.css;
        default_type text/css;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags —
        #                           rewrite ALL of them, not just the first.
        #   - sub_filter_types text/html : ONLY rewrite HTML; JS/CSS bundles are
        #                                  left byte-for-byte untouched.
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body, which would ship un-nonced
        # <script> tags under this CSP and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Type text/plain;
    }
}
