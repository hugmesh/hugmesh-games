; Export presets for Shadows of the Net – CHAT.
;
; [preset.0] Web — the wasm-game bundle. Served by the wasm-fragment nginx at
; /_remotes/wasm-fragment/shadows-of-the-net/index.html and registered in
; federation_modules (migration 056). `make build-godot` derives the output
; slug by lower-casing the preset name: "Shadows-Of-The-Net" →
; "shadows-of-the-net".
;
;   * thread_support=false (DELIBERATE, XR-chat DESIGN §0): single-threaded
;     web export needs NO COOP/COEP cross-origin isolation, which keeps the
;     bundle embeddable inside the Matrix client iframe chain. Audio uses the
;     4.3+ default Sample playback (Web Audio API — fine single-threaded).
;   * extensions_support=false: this game is PURE GDScript (no Rust core to
;     reuse) — it deliberately ships without the hugmesh_bridge
;     GDExtension; the SD_*/Chat3D transports are JavaScriptBridge-based
;     (scripts/session_bridge.gd + scripts/chat3d_bridge.gd).
;
; [preset.1]/[preset.2] Linux + Windows — native PCVR builds (OpenXR:
; SteamVR / Monado / WiVRn / Meta Link). NOT driven by `make build-godot`
; (that target only produces web bundles); export manually or via
; `godot --headless --export-release "Shadows-Of-The-Net-Linux" <path>`.

[preset.0]

name="Shadows-Of-The-Net"
platform="Web"
runnable=true
dedicated_server=false
custom_features="game_shadows_of_the_net"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../backend/src/main/resources/assets/levels/shadows-of-the-net/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="Shadows-Of-The-Net-Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../build/pcvr/shadows-of-the-net-linux/shadows-of-the-net.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"

[preset.2]

name="Shadows-Of-The-Net-Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../build/pcvr/shadows-of-the-net-windows/shadows-of-the-net.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
