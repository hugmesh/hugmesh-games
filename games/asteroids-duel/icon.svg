<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Asteroids Duel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1b2e"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- a few stars -->
  <circle cx="14" cy="16" r="1" fill="#2a2a44"/>
  <circle cx="50" cy="12" r="1.2" fill="#2a2a44"/>
  <circle cx="44" cy="50" r="1" fill="#2a2a44"/>
  <!-- a drifting asteroid (irregular polygon) -->
  <polygon points="42,18 50,22 52,30 47,37 39,36 35,28 37,21"
           fill="none" stroke="#c8ccdd" stroke-width="2" stroke-linejoin="round"/>
  <!-- the player ship (triangle) pointing up-right toward the rock -->
  <polygon points="22,46 14,52 18,44 14,36"
           fill="none" stroke="#b388ff" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- a bullet streaking toward the asteroid -->
  <circle cx="30" cy="34" r="2" fill="#ffd740"/>
</svg>
