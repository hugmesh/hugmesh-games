<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Go">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- goban (wood board) -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#e3b24f" stroke="#7a5a1e" stroke-width="2"/>
  <!-- grid lines: stones sit on intersections -->
  <g stroke="#5a3c12" stroke-width="1.4">
    <line x1="18" y1="18" x2="18" y2="46"/>
    <line x1="32" y1="18" x2="32" y2="46"/>
    <line x1="46" y1="18" x2="46" y2="46"/>
    <line x1="18" y1="18" x2="46" y2="18"/>
    <line x1="18" y1="32" x2="46" y2="32"/>
    <line x1="18" y1="46" x2="46" y2="46"/>
  </g>
  <!-- stones placed on intersections: black + white -->
  <circle cx="18" cy="18" r="6" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="1"/>
  <circle cx="46" cy="18" r="6" fill="#fbfbfb" stroke="#7a5a1e" stroke-width="1"/>
  <circle cx="32" cy="32" r="6" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="1"/>
  <circle cx="18" cy="46" r="6" fill="#fbfbfb" stroke="#7a5a1e" stroke-width="1"/>
  <circle cx="46" cy="46" r="6" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="1"/>
</svg>
