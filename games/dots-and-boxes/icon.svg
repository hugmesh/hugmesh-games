<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dots and Boxes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- one claimed (filled) box, top-left -->
  <rect x="14" y="14" width="18" height="18" fill="#7c4dff" fill-opacity="0.45"/>
  <!-- drawn lines (claimed edges) -->
  <g stroke="#b388ff" stroke-width="3" stroke-linecap="round">
    <line x1="14" y1="14" x2="32" y2="14"/>
    <line x1="14" y1="14" x2="14" y2="32"/>
    <line x1="14" y1="32" x2="32" y2="32"/>
    <line x1="32" y1="14" x2="32" y2="32"/>
    <line x1="32" y1="32" x2="50" y2="32"/>
  </g>
  <!-- the most-recent line, highlighted -->
  <line x1="32" y1="32" x2="32" y2="50" stroke="#ffd740" stroke-width="3" stroke-linecap="round"/>
  <!-- the 3x3 dot grid -->
  <g fill="#f2eefb">
    <circle cx="14" cy="14" r="3"/><circle cx="32" cy="14" r="3"/><circle cx="50" cy="14" r="3"/>
    <circle cx="14" cy="32" r="3"/><circle cx="32" cy="32" r="3"/><circle cx="50" cy="32" r="3"/>
    <circle cx="14" cy="50" r="3"/><circle cx="32" cy="50" r="3"/><circle cx="50" cy="50" r="3"/>
  </g>
</svg>
