<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sudoku">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- 9x9 grid panel -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#1f1b2e" stroke="#7c4dff" stroke-width="2"/>
  <!-- thin cell lines (3 internal per box span) -->
  <g stroke="#3a3358" stroke-width="1">
    <line x1="24" y1="8" x2="24" y2="56"/>
    <line x1="40" y1="8" x2="40" y2="56"/>
    <line x1="8" y1="24" x2="56" y2="24"/>
    <line x1="8" y1="40" x2="56" y2="40"/>
  </g>
  <!-- thick 3x3 box borders -->
  <g stroke="#b388ff" stroke-width="2">
    <line x1="24" y1="8" x2="24" y2="56"/>
    <line x1="40" y1="8" x2="40" y2="56"/>
    <line x1="8" y1="24" x2="56" y2="24"/>
    <line x1="8" y1="40" x2="56" y2="40"/>
  </g>
  <!-- a few sample digits (givens + an entered one) -->
  <g fill="#f2eefb" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    <text x="16" y="21">5</text>
    <text x="48" y="21">3</text>
    <text x="32" y="37">7</text>
    <text x="16" y="53">9</text>
    <text x="48" y="53">1</text>
  </g>
  <text x="32" y="53" fill="#b388ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">8</text>
</svg>
