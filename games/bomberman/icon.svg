<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bomberman">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3145"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- arena hint: a couple of indestructible pillars + a destructible block -->
  <rect x="8" y="8" width="10" height="10" rx="2" fill="#4a5570" stroke="#2a3145" stroke-width="1.5"/>
  <rect x="46" y="46" width="10" height="10" rx="2" fill="#4a5570" stroke="#2a3145" stroke-width="1.5"/>
  <rect x="46" y="8" width="10" height="10" rx="2" fill="#8a6d3b" stroke="#5c4824" stroke-width="1.5"/>
  <!-- the bomb -->
  <circle cx="32" cy="36" r="13" fill="#1a1a1a"/>
  <!-- fuse -->
  <path d="M32 23 q6 -6 10 -10" stroke="#8a6d3b" stroke-width="2.5" fill="none"/>
  <circle cx="43" cy="12" r="3.5" fill="#ffd740"/>
  <!-- a small flame spark -->
  <circle cx="47" cy="9" r="2" fill="#ff7828"/>
</svg>
