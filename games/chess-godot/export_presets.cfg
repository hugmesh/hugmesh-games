; Web export preset for Chess (Godot). One game = one WASM bundle, served
; by the wasm-fragment nginx at /_remotes/wasm-fragment/chess-godot/index.html
; and registered in federation_modules (migration 053). `make build-godot`
; derives the output slug by lower-casing the preset name, so the preset is
; named "Chess-Godot" -> slug "chess-godot". export_path below points at the
; same dir for direct `godot --export-release` invocations.
;
; extensions_support=true: this game REUSES the deterministic chess Rust core
; via the snapdragon_bridge GDExtension (the ChessEngine node). The web export
; therefore needs the bridge built for wasm32-unknown-emscripten
; (`make build-rust` -> bin/snapdragon_bridge.wasm) so the SAME validated core
; that runs natively also runs in the browser. See games/_godot-template.

[preset.0]

name="Chess-Godot"
platform="Web"
runnable=true
dedicated_server=false
custom_features="game_chess_godot"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../backend/src/main/resources/assets/levels/chess-godot/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
