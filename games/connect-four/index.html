<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connect Four — HugMesh</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./connect-four.css" />
  </head>
  <body>
    <div id="hud" role="region" aria-label="Game status">
      <span id="turn" aria-live="polite">Turn: Red</span>
      <span id="status" role="status" aria-live="polite">Red to move</span>
      <button id="reset" type="button">New game</button>
    </div>

    <canvas id="board" width="616" height="532" role="img"
            aria-label="Connect Four board, 7 columns by 6 rows. Click a column to drop a disc."></canvas>

    <script type="module">
      // The Connect Four frontend = the shared shell + this game's GAME object.
      // Paths are RELATIVE so the same bundle serves correctly both from
      //   games/connect-four/index.html               (repo dev / file://)
      // and from the deployed self-contained bundle
      //   /api/assets/levels/connect-four/index.html   (BFF-served; _shared copied in)
      import { mountGame } from './_shared/game-frame.js';
      import { createConnectFourGame } from './connect-four.js';

      const GAME = createConnectFourGame();

      mountGame(GAME, { wasmUrl: './wasm/hugmesh_connect_four.wasm' })
        .then((ctx) => {
          window.__connectFourReady = true; // smoke-test boot signal
          window.__connectFourCtx = ctx; // expose for the headless smoke test
        })
        .catch((err) => {
          const s = document.getElementById('status');
          if (s) s.textContent = 'Failed to load Connect Four engine: ' + err.message;
          console.error('connect-four mount failed', err);
        });
    </script>
  </body>
</html>
