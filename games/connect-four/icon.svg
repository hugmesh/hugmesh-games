<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Connect Four">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- the blue board frame -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="#3949c8" stroke="#7c4dff" stroke-width="1.2"/>
  <!-- a 3x3 sample of holes with a diagonal red four-in-a-row hint -->
  <g>
    <circle cx="21" cy="21" r="5" fill="#e23b3b"/>
    <circle cx="32" cy="21" r="5" fill="#14121c"/>
    <circle cx="43" cy="21" r="5" fill="#f2c53d"/>
    <circle cx="21" cy="32" r="5" fill="#f2c53d"/>
    <circle cx="32" cy="32" r="5" fill="#e23b3b"/>
    <circle cx="43" cy="32" r="5" fill="#14121c"/>
    <circle cx="21" cy="43" r="5" fill="#f2c53d"/>
    <circle cx="32" cy="43" r="5" fill="#f2c53d"/>
    <circle cx="43" cy="43" r="5" fill="#e23b3b"/>
  </g>
</svg>
