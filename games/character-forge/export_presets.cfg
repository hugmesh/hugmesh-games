; Web export preset for Character Forge. One game = one WASM bundle, published
; into hugmesh.games via the standard zip upload (manifest.json v2 +
; register.sql + bundle/ — see register/ and ../Makefile export-web), then
; served by the games BFF at /api/assets/levels/character-forge/index.html.
; `make export-web` lower-cases the preset name to derive the slug, mirroring
; the hugmesh.games Makefile convention: "Character-Forge" -> "character-forge".
;
; Threads are OFF (variant/thread_support=false): a single-threaded build needs
; no COOP/COEP isolation headers, so the bundle stays embeddable inside the
; Matrix client and the games portal without SharedArrayBuffer requirements
; (DESIGN §0). Pure GDScript — no GDExtension, so extensions_support stays off.

[preset.0]

name="Character-Forge"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Non-resource files the RUNTIME reads and Godot would otherwise leave out of
; the PCK ("all_resources" ships imported resources only):
;   assets/packs/*.json  the generated lane catalogue + the per-pack manifests
;                        (scripts/pack_library.gd reads lanes.json at boot; the
;                        licence/attribution strings shown in-app come from it).
;   assets/packs/*.vrm   the VRM avatars. .glb files are IMPORTED (a PackedScene
;                        is in the PCK already and the raw bytes are not needed),
;                        but no .vrm importer is registered in this project, so
;                        the runtime godot-vrm parse needs the original bytes.
;                        HONEST COST: ~12 MB of VRM in the bundle (VRoid bases
;                        6.2 MB, 100Avatars 5.2 MB, Godette 0.5 MB) on top of the
;                        imported GLB scenes.
include_filter="assets/packs/*.json,assets/packs/*.vrm"
exclude_filter="tests/*"
export_path="../../backend/src/main/resources/assets/levels/character-forge/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
