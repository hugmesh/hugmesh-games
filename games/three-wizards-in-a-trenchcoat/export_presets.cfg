; Per-level Web export presets for Three Wizards In A Trenchcoat. Each
; preset produces one WASM bundle that the BFF serves at
; /api/assets/levels/<slug>/. Game-level metadata (the parent row in the
; `games` table) is registered by `addons/hugmesh_export` at upload
; time — see register.sql in the bundle zip.

[preset.0]

name="Cave"
platform="Web"
runnable=true
dedicated_server=false
custom_features="level_cave"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../../backend/src/main/resources/assets/levels/cave/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

