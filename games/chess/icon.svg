<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Chess">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- mini checkerboard corner -->
  <g fill="#9c6b3f">
    <rect x="6" y="46" width="6" height="6"/>
    <rect x="18" y="46" width="6" height="6"/>
    <rect x="12" y="52" width="6" height="6"/>
    <rect x="6" y="52" width="0" height="0"/>
  </g>
  <g fill="#ead9b5">
    <rect x="12" y="46" width="6" height="6"/>
    <rect x="6" y="52" width="6" height="6"/>
    <rect x="18" y="52" width="6" height="6"/>
  </g>
  <!-- a white king glyph, centered -->
  <text x="32" y="40" text-anchor="middle"
        font-family="'Segoe UI Symbol','Noto Sans Symbols2','DejaVu Sans',serif"
        font-size="42" fill="#f2eefb" stroke="#7c4dff" stroke-width="0.6">&#9818;</text>
</svg>
