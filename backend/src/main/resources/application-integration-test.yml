# Integration-testing Spring profile.
#
# Activated by `docker-compose.e2e.yml` (SPRING_PROFILES_ACTIVE=integration-test)
# when the `make e2e` harness brings the stack up. Differs from the
# `dev` profile in that:
#
#   * /v3/api-docs is public (matches dev) so the suite can introspect.
#   * Logging is verbose at the multiplayer + session boundary so a
#     failing spec leaves enough breadcrumbs in `e2e/results/artifacts`
#     to pinpoint which sink/route disagreed.
#   * The Casdoor seed runs with deterministic passwords (one per
#     Casdoor user, each defaulted to ${E2E_PASSWORD}) so every
#     Playwright spec can log every role in without reading the
#     random first-boot dump. See docker-compose.e2e.yml's `casdoor:`
#     environment block for the full role list.
#
# This file does NOT pre-create database fixtures — every seed user
# gets default character rows from Liquibase 002. Specs that need
# extra state (a private session for cross-session-isolation, a
# friend graph, etc.) build it via the public API as the first step
# of the test, so the seed surface stays small and the specs stay
# self-contained.

logging:
  level:
    games.hugmesh.bff: DEBUG
    games.hugmesh.bff.service.GameStateService: TRACE
    games.hugmesh.bff.service.GameSessionService: TRACE
    games.hugmesh.bff.controller.MultiplayerSessionController: DEBUG
    games.hugmesh.bff.controller.GameStreamController: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Make the JSON error body on a ResponseStatusException carry the
# `message` field — the Playwright suite asserts on it for the
# 403/404/409 path checks. Spring's WebFlux default omits the
# message; the integration-test profile flips it on.
server:
  error:
    include-message: always
    include-binding-errors: always

# RateLimitFilter caps for /api/auth/* and /api/admin/actions/*. The
# production defaults (20 attempts per minute per IP) are the
# credential-stuffing defense from decision 017. Under e2e the whole
# Playwright fleet shares one container IP, and the BDD suite alone
# fires ~30 /api/auth/token POSTs in a minute across the per-role
# matrix + lobby + maker scenarios — which trips the 20/min cap and
# subsequent logins see "Invalid credentials" from a 429 the SPA
# can't distinguish from 401. Set the cap to a value that comfortably
# exceeds the whole suite's auth surface but still rejects a real
# brute-force fan-out from one IP. The nginx zone (5 r/s burst=20)
# remains the volumetric floor at the edge.
app:
  rate-limit:
    auth:
      window-seconds: 60
      max-per-window: 1000
