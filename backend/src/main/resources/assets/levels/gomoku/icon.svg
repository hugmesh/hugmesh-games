<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gomoku">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- a wood board square -->
  <rect x="10" y="10" width="44" height="44" rx="3" fill="#d9b779"/>
  <!-- a 5x5 grid -->
  <g stroke="#5a3d22" stroke-width="1.4">
    <line x1="16" y1="16" x2="48" y2="16"/>
    <line x1="16" y1="24" x2="48" y2="24"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
    <line x1="16" y1="40" x2="48" y2="40"/>
    <line x1="16" y1="48" x2="48" y2="48"/>
    <line x1="16" y1="16" x2="16" y2="48"/>
    <line x1="24" y1="16" x2="24" y2="48"/>
    <line x1="32" y1="16" x2="32" y2="48"/>
    <line x1="40" y1="16" x2="40" y2="48"/>
    <line x1="48" y1="16" x2="48" y2="48"/>
  </g>
  <!-- a diagonal of stones: three black, capped by white, suggesting a row -->
  <circle cx="16" cy="48" r="4.5" fill="#161616" stroke="#000" stroke-width="0.5"/>
  <circle cx="24" cy="40" r="4.5" fill="#161616" stroke="#000" stroke-width="0.5"/>
  <circle cx="32" cy="32" r="4.5" fill="#161616" stroke="#000" stroke-width="0.5"/>
  <circle cx="40" cy="24" r="4.5" fill="#161616" stroke="#000" stroke-width="0.5"/>
  <circle cx="48" cy="16" r="4.5" fill="#fafafa" stroke="#444" stroke-width="0.5"/>
</svg>
