<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tetris">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- an S-piece and a T-piece settling in the well, canvas-block style -->
  <!-- S piece (green) -->
  <rect x="26" y="14" width="11" height="11" rx="1.5" fill="#5fd07a" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="37" y="14" width="11" height="11" rx="1.5" fill="#5fd07a" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="15" y="25" width="11" height="11" rx="1.5" fill="#5fd07a" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="26" y="25" width="11" height="11" rx="1.5" fill="#5fd07a" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <!-- T piece (purple) resting at the bottom -->
  <rect x="26" y="39" width="11" height="11" rx="1.5" fill="#b388ff" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="15" y="50" width="11" height="11" rx="1.5" fill="#b388ff" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="26" y="50" width="11" height="11" rx="1.5" fill="#b388ff" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="37" y="50" width="11" height="11" rx="1.5" fill="#b388ff" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
</svg>
