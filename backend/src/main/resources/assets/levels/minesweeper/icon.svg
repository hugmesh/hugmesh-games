<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Minesweeper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2440"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- a 3x3 minefield sample: revealed counts + a flagged cell + a mine -->
  <g stroke="#3a3450" stroke-width="1.2">
    <rect x="12" y="12" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="25.3" y="12" width="13.3" height="13.3" fill="#2a2440"/>
    <rect x="38.6" y="12" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="12" y="25.3" width="13.3" height="13.3" fill="#2a2440"/>
    <rect x="25.3" y="25.3" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="38.6" y="25.3" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="12" y="38.6" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="25.3" y="38.6" width="13.3" height="13.3" fill="#1b1828"/>
    <rect x="38.6" y="38.6" width="13.3" height="13.3" fill="#2a2440"/>
  </g>
  <!-- count digits -->
  <text x="18.6" y="23.2" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5ab0ff" text-anchor="middle">1</text>
  <text x="45.2" y="23.2" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#5fe08a" text-anchor="middle">2</text>
  <text x="31.9" y="49.8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff7676" text-anchor="middle">3</text>
  <!-- a flag -->
  <text x="32" y="23.4" font-size="11" fill="#ff5c5c" text-anchor="middle">⚑</text>
  <!-- a mine burst -->
  <text x="45.2" y="50" font-size="12" fill="#f2eefb" text-anchor="middle">✸</text>
</svg>
