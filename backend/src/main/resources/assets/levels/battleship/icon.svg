<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Battleship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143a68"/>
      <stop offset="1" stop-color="#14121c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- sea grid hint -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#11335c" stroke="#0a2240" stroke-width="2"/>
  <line x1="24" y1="8" x2="24" y2="56" stroke="#0a2240" stroke-width="1.5"/>
  <line x1="40" y1="8" x2="40" y2="56" stroke="#0a2240" stroke-width="1.5"/>
  <line x1="8" y1="24" x2="56" y2="24" stroke="#0a2240" stroke-width="1.5"/>
  <line x1="8" y1="40" x2="56" y2="40" stroke="#0a2240" stroke-width="1.5"/>
  <!-- a ship hull -->
  <rect x="12" y="28" width="32" height="9" rx="3" fill="#5a6b7e" stroke="#1a1a1a" stroke-width="1.4"/>
  <!-- a hit marker -->
  <circle cx="20" cy="32.5" r="3.4" fill="#ff5c5c"/>
  <!-- a miss marker -->
  <circle cx="46" cy="18" r="2.4" fill="#a8acc4"/>
</svg>
