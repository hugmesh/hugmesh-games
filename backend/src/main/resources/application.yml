server:
  port: 8080

spring:
  application:
    name: snapdragon-gaming-bff
  webflux:
    base-path: /
    multipart:
      # Large-file uploads — game bundle zips can run into the
      # hundreds of megabytes once Godot ships full-resolution
      # textures + audio assets. The defaults (256 KB in-memory,
      # unlimited disk) would either OOM the BFF or have no upper
      # bound. Pin both: anything below max-in-memory-size buffers
      # in heap; anything larger spills to the OS temp dir;
      # max-disk-usage-per-part caps the spill so a malicious client
      # can't fill the disk.
      #
      # All three are env-overridable so the staging / prod overlays
      # can dial these per-environment. The temp-spill location is
      # configured via the standard java.io.tmpdir property; set
      # APP_MULTIPART_TMP via an env var on the container if you
      # want a dedicated volume.
      max-in-memory-size:        ${APP_MAX_IN_MEMORY:1MB}
      max-disk-usage-per-part:   ${APP_MAX_PART_SIZE:1024MB}
      max-parts:                 ${APP_MAX_PARTS:32}
  codec:
    # WebFlux's default in-memory codec buffer is 256 KB — too small
    # for a game upload's request body proxy through. Bump it.
    max-in-memory-size:          ${APP_CODEC_MAX:16MB}

  # R2DBC — all runtime data access (non-blocking)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threewizards}
    username: ${DB_USER:threewizards}
    password: ${DB_PASS:threewizards}

  # JDBC DataSource — used only by Liquibase (blocking migrations at startup)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threewizards}
    username: ${DB_USER:threewizards}
    password: ${DB_PASS:threewizards}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Reactive Cassandra — cross-pod session/cache layer (see docker/cassandra-init.cql).
  # Spring auto-discovers Reactive Cassandra when the starter is on the classpath;
  # we only need the keyspace + contact points.
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:cassandra:9042}
    keyspace-name:  ${CASSANDRA_KEYSPACE:threewizards}
    local-datacenter: ${CASSANDRA_LOCAL_DC:dc1}
    schema-action: NONE   # init script in docker creates the schema; never auto-create here
    request:
      timeout: 10s
    connection:
      connect-timeout: 30s
      init-query-timeout: 30s

  # OAuth2 Resource Server — validate JWTs issued by Casdoor
  security:
    oauth2:
      resourceserver:
        jwt:
          # Standard unauthenticated JWKS endpoint. Casdoor's /api/get-jwks requires
          # an admin token — using it here causes Spring Security's JWT decoder to
          # explode with "Missing required 'keys' member" and returns 500 on every
          # request that carries a Bearer header, including permitAll endpoints.
          jwk-set-uri: ${CASDOOR_ENDPOINT:http://localhost:8000}/.well-known/jwks

casdoor:
  endpoint: ${CASDOOR_ENDPOINT:http://localhost:8000}
  client-id: ${CASDOOR_CLIENT_ID:twclient001}
  client-secret: ${CASDOOR_CLIENT_SECRET:twsecret001}
  organization: ${CASDOOR_ORGANIZATION:threewizards}

# Revocation list — polled from the same Cassandra table the
# snapdragon-gateway writes. Defence-in-depth check inside
# RateLimitFilter; the gateway is the primary enforcement point.
# Lookups are constant-time hash hits against a cached snapshot;
# the @Scheduled refresh ticks every 5 s by default.
app:
  revocation:
    enabled: ${APP_REVOCATION_ENABLED:true}
    refresh-interval-ms: ${APP_REVOCATION_REFRESH_MS:5000}

  # Banned-user appeal channel — recipient address surfaced on the
  # /banned federated remote. AppealContactController resolves the
  # current primary / secondary on-call mod from accounts.mods and
  # falls back to this address when no on-call slot has an email
  # on file (e.g. a fresh stack before any mod has been approved).
  security:
    appeal-contact-fallback: ${APP_SECURITY_APPEAL_CONTACT_FALLBACK:support@snapdragon.games}

  # Upload storage strategy for hot-uploaded game bundles. Two backends:
  #   filesystem (default) — bundle files land under `games-dir` on the
  #                          BFF host's filesystem. Same behaviour the
  #                          platform shipped with; no new infra needed.
  #   s3                    — bundle files land in an S3-compatible
  #                          bucket. compose ships a `minio` container
  #                          for dev; prod points the four `s3.*` knobs
  #                          at a real bucket (or any S3-compatible
  #                          service: Cloudflare R2, Backblaze B2, etc.).
  #
  # Picking `s3` removes the single-host disk-pressure failure mode and
  # is the precondition for horizontally scaling the BFF beyond one host.
  uploads:
    storage: ${APP_UPLOADS_STORAGE:filesystem}
    games-dir: ${APP_UPLOADS_GAMES_DIR:/var/snapdragon/games}
    versions-to-keep: ${APP_UPLOADS_VERSIONS_TO_KEEP:3}
    s3:
      endpoint:   ${APP_UPLOADS_S3_ENDPOINT:}
      region:     ${APP_UPLOADS_S3_REGION:us-east-1}
      access-key: ${APP_UPLOADS_S3_ACCESS_KEY:}
      secret-key: ${APP_UPLOADS_S3_SECRET_KEY:}
      bucket:     ${APP_UPLOADS_S3_BUCKET:snapdragon-uploads}
      # path-style URLs (bucket-in-path, not bucket-as-subdomain) are
      # the MinIO + many third-party S3 clones' required dialect.
      # AWS proper accepts both; flip to false only if you target a
      # subdomain-style bucket on real AWS.
      path-style: ${APP_UPLOADS_S3_PATH_STYLE:true}
      # Decision-020 follow-up. When `true`, AssetController returns a
      # 302 redirect to a short-lived pre-signed URL instead of
      # streaming the asset bytes through the BFF. Takes the WASM hot
      # path off the BFF cold path entirely. Default `false` keeps the
      # original streaming semantics. TTL caps at 15 minutes inside the
      # storage layer regardless of the configured value.
      presigned-reads: ${APP_UPLOADS_S3_PRESIGNED_READS:false}
      presigned-reads-ttl-seconds: ${APP_UPLOADS_S3_PRESIGNED_TTL_SEC:300}

  # Streaming audit + telemetry pipeline (decision 021).
  #
  # When `app.kafka.enabled=true`, the BFF produces state-transition
  # events to the `state_audit` topic; a follow-up PR will also produce
  # F2 game-KPI events to `game_kpi`. ClickHouse consumes both via its
  # built-in Kafka engine table so the BFF doesn't ship a separate
  # consumer service.
  #
  # Default OFF — vanilla compose-up doesn't bring the kafka container
  # up. Flip to `true` in production + integration-test profiles.
  kafka:
    enabled: ${APP_KAFKA_ENABLED:false}
    bootstrap-servers: ${APP_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    client-id:         ${APP_KAFKA_CLIENT_ID:snapdragon-bff}
    topic:
      state-audit: ${APP_KAFKA_TOPIC_STATE_AUDIT:state_audit}
      game-kpi:    ${APP_KAFKA_TOPIC_GAME_KPI:game_kpi}
      game-events: ${APP_KAFKA_TOPIC_GAME_EVENTS:game_events}
    consumer:
      group-id:    ${APP_KAFKA_CONSUMER_GROUP_ID:snapdragon-bff-cross-pod}

  # ClickHouse client — used by PlayerStateRecoveryService to read the
  # latest player position from snapdragon.player_state_current FINAL
  # when a player reconnects via a pod that wasn't the original
  # session host (decision 021). Disabled by default; enabled in
  # production + integration-test profiles alongside app.kafka.enabled.
  clickhouse:
    enabled:  ${APP_CLICKHOUSE_ENABLED:false}
    endpoint: ${APP_CLICKHOUSE_ENDPOINT:http://clickhouse:8123}
    user:     ${APP_CLICKHOUSE_USER:default}
    password: ${APP_CLICKHOUSE_PASSWORD:}
    database: ${APP_CLICKHOUSE_DATABASE:snapdragon}
    tables:
      player-state-current: ${APP_CLICKHOUSE_TBL_PLAYER_STATE_CURRENT:snapdragon.player_state_current}

  pod-id: ${APP_POD_ID:}

  # Optional Postgres read replica (decision 022 / F3). When provisioned,
  # catalog reads (/api/games/* and friends) qualified with
  # @Qualifier("replica") route here instead of hitting the primary.
  # When the URL is empty (the default), the @Qualifier("replica") bean
  # aliases the primary CF — services with the qualifier already wired
  # keep working in single-DB deployments.
  r2dbc:
    replica:
      url:      ${APP_R2DBC_REPLICA_URL:}
      username: ${APP_R2DBC_REPLICA_USER:${DB_USER:threewizards}}
      password: ${APP_R2DBC_REPLICA_PASS:${DB_PASS:threewizards}}

# Resilience4j — wraps the cluster-wide Cassandra calls inside
# RateLimitFilter. An open breaker means subsequent requests skip
# the cluster check (fall back to local-bucket only) instead of
# piling up call latency.
resilience4j:
  circuitbreaker:
    instances:
      cassandra:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      # S3 / MinIO bucket calls. Wraps CircuitBreakerUploadStorage
      # (decision-020 follow-up). Tighter window than cassandra
      # because a hung S3 endpoint stalls AssetController on every
      # asset fetch — open the breaker faster, recover faster.
      # Reads soft-fall through to null on OPEN so AssetController
      # can serve the classpath fallback bundles; writes propagate
      # the UploadStorageException so the catalog doesn't silently
      # miss installs.
      s3:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2

# Management endpoints: lock down what /actuator can expose so
# even if SecurityConfig regressed, the surface is the bare
# minimum (health for probes; everything else off). The
# SecurityConfig path-matchers above also restrict /actuator/**
# to ROLE_GAME-MASTER as defence-in-depth.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # Detailed health (component statuses, Postgres/Cassandra
      # reachability, free disk) is restricted to GAME-MASTER.
      # An anonymous probe still gets `{"status":"UP"}` — enough
      # to satisfy a k8s liveness check without leaking topology.
      roles: GAME-MASTER

logging:
  level:
    "[games.snapdragon.bff]": DEBUG
    "[org.springframework.web]": INFO
    "[org.springframework.security]": INFO
