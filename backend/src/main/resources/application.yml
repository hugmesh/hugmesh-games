server:
  port: 8080

spring:
  application:
    name: snapdragon-gaming-bff
  webflux:
    base-path: /
    multipart:
      # Large-file uploads — game bundle zips can run into the
      # hundreds of megabytes once Godot ships full-resolution
      # textures + audio assets. The defaults (256 KB in-memory,
      # unlimited disk) would either OOM the BFF or have no upper
      # bound. Pin both: anything below max-in-memory-size buffers
      # in heap; anything larger spills to the OS temp dir;
      # max-disk-usage-per-part caps the spill so a malicious client
      # can't fill the disk.
      #
      # All three are env-overridable so the staging / prod overlays
      # can dial these per-environment. The temp-spill location is
      # configured via the standard java.io.tmpdir property; set
      # APP_MULTIPART_TMP via an env var on the container if you
      # want a dedicated volume.
      max-in-memory-size:        ${APP_MAX_IN_MEMORY:1MB}
      max-disk-usage-per-part:   ${APP_MAX_PART_SIZE:1024MB}
      max-parts:                 ${APP_MAX_PARTS:32}
  codec:
    # WebFlux's default in-memory codec buffer is 256 KB — too small
    # for a game upload's request body proxy through. Bump it.
    max-in-memory-size:          ${APP_CODEC_MAX:16MB}

  # R2DBC — all runtime data access (non-blocking)
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threewizards}
    username: ${DB_USER:threewizards}
    password: ${DB_PASS:threewizards}

  # JDBC DataSource — used only by Liquibase (blocking migrations at startup)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threewizards}
    username: ${DB_USER:threewizards}
    password: ${DB_PASS:threewizards}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Reactive Cassandra — cross-pod session/cache layer (see docker/cassandra-init.cql).
  # Spring auto-discovers Reactive Cassandra when the starter is on the classpath;
  # we only need the keyspace + contact points.
  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINTS:cassandra:9042}
    keyspace-name:  ${CASSANDRA_KEYSPACE:threewizards}
    local-datacenter: ${CASSANDRA_LOCAL_DC:dc1}
    schema-action: NONE   # init script in docker creates the schema; never auto-create here
    request:
      timeout: 10s
    connection:
      connect-timeout: 30s
      init-query-timeout: 30s

  # OAuth2 Resource Server — validate JWTs issued by Casdoor
  security:
    oauth2:
      resourceserver:
        jwt:
          # Standard unauthenticated JWKS endpoint. Casdoor's /api/get-jwks requires
          # an admin token — using it here causes Spring Security's JWT decoder to
          # explode with "Missing required 'keys' member" and returns 500 on every
          # request that carries a Bearer header, including permitAll endpoints.
          jwk-set-uri: ${CASDOOR_ENDPOINT:http://localhost:8000}/.well-known/jwks

casdoor:
  endpoint: ${CASDOOR_ENDPOINT:http://localhost:8000}
  client-id: ${CASDOOR_CLIENT_ID:twclient001}
  client-secret: ${CASDOOR_CLIENT_SECRET:twsecret001}
  organization: ${CASDOOR_ORGANIZATION:threewizards}

# Revocation list — polled from the same Cassandra table the
# snapdragon-gateway writes. Defence-in-depth check inside
# RateLimitFilter; the gateway is the primary enforcement point.
# Lookups are constant-time hash hits against a cached snapshot;
# the @Scheduled refresh ticks every 5 s by default.
app:
  revocation:
    enabled: ${APP_REVOCATION_ENABLED:true}
    refresh-interval-ms: ${APP_REVOCATION_REFRESH_MS:5000}

# Resilience4j — wraps the cluster-wide Cassandra calls inside
# RateLimitFilter. An open breaker means subsequent requests skip
# the cluster check (fall back to local-bucket only) instead of
# piling up call latency.
resilience4j:
  circuitbreaker:
    instances:
      cassandra:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# Management endpoints: lock down what /actuator can expose so
# even if SecurityConfig regressed, the surface is the bare
# minimum (health for probes; everything else off). The
# SecurityConfig path-matchers above also restrict /actuator/**
# to ROLE_GAME-MASTER as defence-in-depth.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      # Detailed health (component statuses, Postgres/Cassandra
      # reachability, free disk) is restricted to GAME-MASTER.
      # An anonymous probe still gets `{"status":"UP"}` — enough
      # to satisfy a k8s liveness check without leaking topology.
      roles: GAME-MASTER

logging:
  level:
    "[games.snapdragon.bff]": DEBUG
    "[org.springframework.web]": INFO
    "[org.springframework.security]": INFO
