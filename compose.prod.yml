# Snapdragon Games — production overlay
#
# Apply on top of the base compose.yml:
#   docker compose -f compose.yml -f compose.prod.yml up -d
#
# Routing model on production:
#   snapdragon.games                              (host shell, apex)
#   <service>.snapdragon.games                    (auth / admin / api docs)
#   <game>.snapdragon.games                       (each game's federated remote)
#   wasm.snapdragon.games                         (asset-tier WASM fragment)
#   api.snapdragon.games                          (BFF)
#
# Strict mode:
#   - SNAPDRAGON_TAG MUST be set (no :dev fallback in prod).
#   - Spring CORS allowlist is the apex + every *.snapdragon.games host.
#   - Postgres + Cassandra ports are NOT bound — managed by an external
#     managed service in steady state; the local containers shipped here
#     are for failover bring-up only.
#
# Staging: see compose.staging.yml for the *.staging.snapdragon.games
# equivalent (loosened CORS, different volumes, different DNS).

services:
  postgres:
    # Replace with `external_link:` to a managed Postgres in real prod.
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    ports: !reset []

  cassandra:
    ports: !reset []
    volumes:
      - cassandra-prod:/var/lib/cassandra

  casdoor:
    environment:
      CASDOOR_ORIGIN: "https://login.snapdragon.games"
      CASDOOR_PUBLIC_BASE_URL: "https://login.snapdragon.games"

  api:
    image: snapdragon-games/bff:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_WEB_CORS_ALLOWED_ORIGINS: "https://snapdragon.games,https://*.snapdragon.games"
      APP_PUBLIC_HOST: snapdragon.games
      APP_PUBLIC_SCHEME: https
      CASDOOR_PUBLIC_BASE_URL: https://login.snapdragon.games
      # Production upload limits — bigger ceiling than staging since
      # a real shipped game bundle (full audio + textures) can hit a
      # gigabyte. APP_GAMES_UPLOAD_HOST_DIR MUST be set in prod;
      # default points at a known-bad tmpfs path so a misconfigured
      # deploy fails fast instead of silently writing into ephemeral
      # storage.
      APP_MAX_IN_MEMORY:    ${APP_MAX_IN_MEMORY:-2MB}
      APP_MAX_PART_SIZE:    ${APP_MAX_PART_SIZE:-4096MB}
      APP_MAX_PARTS:        ${APP_MAX_PARTS:-32}
      APP_CODEC_MAX:        ${APP_CODEC_MAX:-16MB}
      APP_UPLOADS_GAMES_DIR: /var/snapdragon/games
    expose: ["8080"]
    volumes:
      - !reset null
      - ${APP_GAMES_UPLOAD_HOST_DIR:?APP_GAMES_UPLOAD_HOST_DIR must be set on prod (path to a durable host volume)}:/var/snapdragon/games

  frontend:
    image: snapdragon-games/portal-host:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
    environment:
      PUBLIC_HOSTNAME: snapdragon.games
      # Production CORS is the apex + EVERY subdomain on snapdragon.games.
      # Staging uses a separate suffix so the two never bleed into each
      # other.
      ALLOW_ORIGIN: "https://*.snapdragon.games"
    # `PROD_FRONTEND_BIND` lets the operator pick the bind interface
    # depending on the deploy topology:
    #
    #   PROD_FRONTEND_BIND=127.0.0.1:   (default)
    #     Loopback only — assumes an upstream reverse proxy (nginx,
    #     Caddy, an ELB / Cloud LB) terminates TLS at snapdragon.games
    #     and forwards to this host's 127.0.0.1:8080. This is the
    #     standard prod posture.
    #
    #   PROD_FRONTEND_BIND=0.0.0.0:
    #     Bind to every interface so the host itself terminates the
    #     public traffic. Use only when there is no upstream LB
    #     (single-VM deploy with Let's Encrypt in front of this nginx
    #     directly). The frontend's nginx already carries the per-IP
    #     rate-limit zones sized for ~10 000 concurrent users; behind
    #     a managed LB those zones still fire on a per-client-IP basis
    #     as long as the LB forwards X-Real-IP / X-Forwarded-For
    #     correctly.
    #
    # Use PROD_FRONTEND_PORT to remap the host-side port when binding
    # to 0.0.0.0 (defaults to 8080 so the upstream-LB topology stays
    # the historical default).
    ports:
      - "${PROD_FRONTEND_BIND:-127.0.0.1:}${PROD_FRONTEND_PORT:-8080}:8080"

  login:
    image: snapdragon-games/login-remote:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
  admin:
    image: snapdragon-games/admin-remote:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
  api-docs:
    image: snapdragon-games/api-docs-remote:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
  games-three-wizards:
    image: snapdragon-games/three-wizards-remote:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
  games-dodecahedron:
    image: snapdragon-games/dodecahedron-remote:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}
  wasm-fragment:
    image: snapdragon-games/wasm-fragment:${SNAPDRAGON_TAG:?SNAPDRAGON_TAG must be set on prod}

volumes:
  pgdata-prod:
  cassandra-prod:
