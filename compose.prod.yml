# HugMesh Games — production overlay
#
# Apply on top of the base docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d
#
# Routing model on production:
#   hugmesh.games                              (host shell, apex)
#   <service>.hugmesh.games                    (auth / admin / api docs)
#   <game>.hugmesh.games                       (each game's federated remote)
#   wasm.hugmesh.games                         (asset-tier WASM fragment)
#   api.hugmesh.games                          (BFF)
#
# Strict mode:
#   - HUGMESH_TAG MUST be set (no :dev fallback in prod).
#   - Spring CORS allowlist is the apex + every *.hugmesh.games host.
#   - Postgres + Cassandra ports are NOT bound — managed by an external
#     managed service in steady state; the local containers shipped here
#     are for failover bring-up only.
#
# Staging: see compose.staging.yml for the *.staging.hugmesh.games
# equivalent (loosened CORS, different volumes, different DNS).

services:
  postgres:
    # Replace with `external_link:` to a managed Postgres in real prod.
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    ports: !reset []

  cassandra:
    ports: !reset []
    volumes:
      - cassandra-prod:/var/lib/cassandra

  casdoor:
    environment:
      CASDOOR_ORIGIN: "https://login.hugmesh.games"
      CASDOOR_PUBLIC_BASE_URL: "https://login.hugmesh.games"

  api:
    image: hugmesh-games/bff:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Fail fast at boot if any prod-sensitive credential (Casdoor
      # client-secret, DB password) is unset (NIST IA-5 / OWASP ASVS
      # 6.2.2). In the real cluster these arrive via k8s + ESO + Vault.
      APP_SECURITY_REQUIRE_MANAGED_SECRETS: "true"
      SPRING_WEB_CORS_ALLOWED_ORIGINS: "https://hugmesh.games,https://*.hugmesh.games"
      APP_PUBLIC_HOST: hugmesh.games
      APP_PUBLIC_SCHEME: https
      CASDOOR_PUBLIC_BASE_URL: https://login.hugmesh.games
      # Production upload limits — bigger ceiling than staging since
      # a real shipped game bundle (full audio + textures) can hit a
      # gigabyte. APP_GAMES_UPLOAD_HOST_DIR MUST be set in prod;
      # default points at a known-bad tmpfs path so a misconfigured
      # deploy fails fast instead of silently writing into ephemeral
      # storage.
      APP_MAX_IN_MEMORY:    ${APP_MAX_IN_MEMORY:-2MB}
      APP_MAX_PART_SIZE:    ${APP_MAX_PART_SIZE:-4096MB}
      APP_MAX_PARTS:        ${APP_MAX_PARTS:-32}
      APP_CODEC_MAX:        ${APP_CODEC_MAX:-16MB}
      APP_UPLOADS_GAMES_DIR: /var/hugmesh/games
    expose: ["8080"]
    volumes:
      - !reset null
      - ${APP_GAMES_UPLOAD_HOST_DIR:?APP_GAMES_UPLOAD_HOST_DIR must be set on prod (path to a durable host volume)}:/var/hugmesh/games

  frontend:
    image: hugmesh-games/portal-host:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
    environment:
      PUBLIC_HOSTNAME: hugmesh.games
      # Production CORS is the apex + EVERY subdomain on hugmesh.games.
      # Staging uses a separate suffix so the two never bleed into each
      # other.
      ALLOW_ORIGIN: "https://*.hugmesh.games"
    # `PROD_FRONTEND_BIND` lets the operator pick the bind interface
    # depending on the deploy topology:
    #
    #   PROD_FRONTEND_BIND=127.0.0.1:   (default)
    #     Loopback only — assumes an upstream reverse proxy (nginx,
    #     Caddy, an ELB / Cloud LB) terminates TLS at hugmesh.games
    #     and forwards to this host's 127.0.0.1:8080. This is the
    #     standard prod posture.
    #
    #   PROD_FRONTEND_BIND=0.0.0.0:
    #     Bind to every interface so the host itself terminates the
    #     public traffic. Use only when there is no upstream LB
    #     (single-VM deploy with Let's Encrypt in front of this nginx
    #     directly). The frontend's nginx already carries the per-IP
    #     rate-limit zones sized for ~10 000 concurrent users; behind
    #     a managed LB those zones still fire on a per-client-IP basis
    #     as long as the LB forwards X-Real-IP / X-Forwarded-For
    #     correctly.
    #
    # Use PROD_FRONTEND_PORT to remap the host-side port when binding
    # to 0.0.0.0 (defaults to 8080 so the upstream-LB topology stays
    # the historical default).
    ports:
      - "${PROD_FRONTEND_BIND:-127.0.0.1:}${PROD_FRONTEND_PORT:-8080}:8080"

  login:
    image: hugmesh-games/login-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
  admin:
    image: hugmesh-games/admin-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
  api-docs:
    image: hugmesh-games/api-docs-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
  games-three-wizards:
    image: hugmesh-games/three-wizards-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
  games-dodecahedron:
    image: hugmesh-games/dodecahedron-remote:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}
  wasm-fragment:
    image: hugmesh-games/wasm-fragment:${HUGMESH_TAG:?HUGMESH_TAG must be set on prod}

volumes:
  pgdata-prod:
  cassandra-prod:
