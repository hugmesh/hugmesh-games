# Compose overlay for `make e2e` — adds TLS to the frontend, mounts the
# Java truststore + keystore into the api, and adds a Playwright e2e service.
#
# Usage (from `make e2e`):
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d ...
#
# CERT_PATH=/abs/path skips cert generation (provide your own ca.crt + p12s).

services:

  frontend:
    # nginx serves HTTPS on container:8443 with the self-signed server cert;
    # api stays plain HTTP behind the proxy. The browser-facing TLS is what
    # matters for the cross-stack E2E. Override the host:container mapping
    # from base compose so :8080 routes to the TLS listener inside.
    ports: !override
      - "8080:8443"
    volumes:
      - ${CERT_PATH:-./e2e/certs}:/etc/nginx/certs:ro
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    # Truststore mounted so the api can verify peer TLS (Casdoor, future
    # Cassandra TLS, mTLS client certs). Keystore is available for when we
    # flip on `server.ssl.enabled=true` to terminate HTTPS in-process.
    volumes:
      - ${CERT_PATH:-./e2e/certs}:/etc/api/certs:ro
    environment:
      # Pulled in by JdbcDataSourceConfig + the JWT decoder. Setting via
      # JAVA_TOOL_OPTIONS makes the JVM honour them on every outbound TLS.
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/etc/api/certs/truststore.p12
        -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=${KEYSTORE_PASSWORD:-threewizards}
      KEYSTORE_PATH: /etc/api/certs/keystore.p12
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-threewizards}
      TRUSTSTORE_PATH: /etc/api/certs/truststore.p12
      TRUSTSTORE_PASSWORD: ${KEYSTORE_PASSWORD:-threewizards}
      # Integration-testing profile: every Casdoor seed user gets a
      # deterministic password so the Playwright suite can log each
      # role in without reading the random first-boot dump. Override
      # individual passwords by exporting the matching env var; the
      # E2E_PASSWORD default is what the specs hard-code as a fallback.
      CASDOOR_ADMIN_PASS:        ${E2E_ADMIN_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER_PASS:       ${E2E_PLAYER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER1_PASS:      ${E2E_PLAYER1_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER2_PASS:      ${E2E_PLAYER2_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER3_PASS:      ${E2E_PLAYER3_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_PASS:          ${E2E_MOD_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_TWIAT_PASS:    ${E2E_MOD_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_DODEC_PASS:    ${E2E_MOD_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUBLISHER_PASS:    ${E2E_PUBLISHER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUB_TWIAT_PASS:    ${E2E_PUB_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUB_DODEC_PASS:    ${E2E_PUB_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      # Spring profile that toggles the integration-testing seed
      # (ChapterController fixtures + a known controller character so
      # the multi-user specs can drive deterministic positions).
      SPRING_PROFILES_ACTIVE: integration-test

  casdoor:
    environment:
      CASDOOR_ADMIN_PASS:        ${E2E_ADMIN_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER_PASS:       ${E2E_PLAYER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER1_PASS:      ${E2E_PLAYER1_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER2_PASS:      ${E2E_PLAYER2_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PLAYER3_PASS:      ${E2E_PLAYER3_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_PASS:          ${E2E_MOD_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_TWIAT_PASS:    ${E2E_MOD_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_MOD_DODEC_PASS:    ${E2E_MOD_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUBLISHER_PASS:    ${E2E_PUBLISHER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUB_TWIAT_PASS:    ${E2E_PUB_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      CASDOOR_PUB_DODEC_PASS:    ${E2E_PUB_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}

  e2e:
    build:
      context: ./e2e
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
    environment:
      # Hits the frontend service over the docker network on its TLS listener.
      # Going through host.docker.internal:8080 is unreliable on Linux (the
      # host-gateway hop can fail with ERR_ADDRESS_UNREACHABLE), and we still
      # exercise the same nginx + TLS + /api proxy path — just one hop shorter.
      E2E_BASE_URL: ${E2E_BASE_URL:-https://frontend:8443}
      E2E_PLAYER_USERNAME: ${E2E_PLAYER_USERNAME:-player}
      # All e2e roles default to the same password unless the host
      # exports a per-role override. The Playwright specs read these
      # off process.env so changing the password in one place flows
      # everywhere.
      E2E_PASSWORD:           ${E2E_PASSWORD:-e2e-pass}
      E2E_PLAYER_PASSWORD:    ${E2E_PLAYER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PLAYER1_PASSWORD:   ${E2E_PLAYER1_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PLAYER2_PASSWORD:   ${E2E_PLAYER2_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PLAYER3_PASSWORD:   ${E2E_PLAYER3_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_ADMIN_PASSWORD:     ${E2E_ADMIN_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_MOD_PASSWORD:       ${E2E_MOD_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PUBLISHER_PASSWORD: ${E2E_PUBLISHER_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_MOD_TWIAT_PASSWORD: ${E2E_MOD_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_MOD_DODEC_PASSWORD: ${E2E_MOD_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PUB_TWIAT_PASSWORD: ${E2E_PUB_TWIAT_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
      E2E_PUB_DODEC_PASSWORD: ${E2E_PUB_DODEC_PASSWORD:-${E2E_PASSWORD:-e2e-pass}}
    volumes:
      - ./e2e/results:/work/results
    profiles:
      # `up` won't start this; only `compose run --rm e2e` does.
      - e2e

volumes:
  pgdata:
  cassandra_data:
