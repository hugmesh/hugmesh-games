services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threewizards
      POSTGRES_USER: threewizards
      POSTGRES_PASSWORD: threewizards
    # Default: loopback-only — Postgres holds Casdoor seeds + BFF
    # game state, neither of which should be reachable from a LAN
    # peer. Override POSTGRES_BIND=0.0.0.0: via lan.properties when
    # you want DB GUI access from another workstation on the same
    # network.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:}5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threewizards"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated DB for the rpg-builder side service. Liquibase migrates
  # the schema (rpg_projects / rpg_areas / rpg_rooms / rpg_exits / …)
  # on every boot of the `rpg-builder` service so the DB is fully
  # managed by versioned changesets — no hand-applied SQL.
  postgres-rpg-builder:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpg_builder
      POSTGRES_USER: rpg_builder
      POSTGRES_PASSWORD: rpg_builder
    volumes:
      - pgdata_rpg_builder:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpg_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated DB for the vn-builder side service. Same pattern as the
  # rpg-builder DB — Liquibase migrates vn_projects / vn_acts /
  # vn_scenes / vn_lines / vn_choices on boot.
  postgres-vn-builder:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vn_builder
      POSTGRES_USER: vn_builder
      POSTGRES_PASSWORD: vn_builder
    volumes:
      - pgdata_vn_builder:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vn_builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  casdoor:
    image: casbin/casdoor:latest
    entrypoint: ["/bin/sh", "/casdoor-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      # Set these explicitly to override generated random values; leave
      # unset to get a secure random secret printed to container logs on
      # first run. The full seed-user set (player1/2/3, mod variants,
      # publisher variants, the Flatland fixture owner) is wired here so
      # `docker compose up -d` produces the same Casdoor directory the
      # e2e `integration-test` profile uses — only the password defaults
      # differ (random vs deterministic e2e-pass). The e2e overlay
      # (docker-compose.e2e.yml) pins all of these to E2E_PASSWORD.
      CASDOOR_CLIENT_ID:      ${CASDOOR_CLIENT_ID:-twclient001}
      CASDOOR_CLIENT_SECRET:  ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_ADMIN_PASS:     ${CASDOOR_ADMIN_PASS:-}
      CASDOOR_PLAYER_PASS:    ${CASDOOR_PLAYER_PASS:-}
      CASDOOR_PLAYER1_PASS:   ${CASDOOR_PLAYER1_PASS:-}
      CASDOOR_PLAYER2_PASS:   ${CASDOOR_PLAYER2_PASS:-}
      CASDOOR_PLAYER3_PASS:   ${CASDOOR_PLAYER3_PASS:-}
      CASDOOR_MOD_PASS:       ${CASDOOR_MOD_PASS:-}
      CASDOOR_MOD_TWIAT_PASS: ${CASDOOR_MOD_TWIAT_PASS:-}
      CASDOOR_MOD_DODEC_PASS: ${CASDOOR_MOD_DODEC_PASS:-}
      CASDOOR_PUBLISHER_PASS: ${CASDOOR_PUBLISHER_PASS:-}
      CASDOOR_PUB_TWIAT_PASS: ${CASDOOR_PUB_TWIAT_PASS:-}
      CASDOOR_PUB_DODEC_PASS: ${CASDOOR_PUB_DODEC_PASS:-}
      CASDOOR_PUB_FLAT_PASS:  ${CASDOOR_PUB_FLAT_PASS:-}
    volumes:
      - ./casdoor/conf:/conf
      - ./casdoor/init_data.json.tpl:/init_data.json.tpl
      - ./casdoor/entrypoint.sh:/casdoor-init.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cassandra:
    # Cross-pod session/cache layer. The api uses it as a CQL-backed store of
    # active sessions / per-pod controller leases / aggregate stats so a
    # multi-pod deployment can answer admin-stream queries from any pod
    # without a fan-out to the others.
    image: cassandra:5
    environment:
      CASSANDRA_CLUSTER_NAME: ThreeWizardsCluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # ── Analytics pipeline (decision-021) ─────────────────────────────────
  # The BFF produces state-transition + telemetry events to Kafka; a
  # ClickHouse `Kafka` engine table auto-pulls those into a MergeTree
  # table for cheap aggregate reads. Replaces the nightly batch
  # CassandraSyncService → analytics-warehouse hand-off; the per-game
  # KPI surface (F2) feeds the same topic shape so one consumer drains
  # both. Containers stay opt-in: vanilla `docker compose up -d` skips
  # them unless the explicit `--profile analytics` or env-flag enables.

  zookeeper:
    # Bitnami images (matches Postgres + Casdoor pattern in this stack).
    # Standalone mode — KRaft-mode Kafka would skip this entirely but the
    # Bitnami Kafka image still expects Zookeeper at the time of writing.
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    expose:
      - "2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka:
    # Single-broker dev cluster. Production points at managed Kafka
    # (MSK / Confluent Cloud / Aiven / Redpanda Cloud) by overriding
    # `app.kafka.bootstrap-servers`; the broker config below is
    # dev-only.
    image: bitnami/kafka:3.7
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT for the compose-internal API +
      # consumers, EXTERNAL for `kcat`/`kafka-console-consumer`
      # debugging from the host.
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      # Auto-create topics for the dev loop — `state_audit` +
      # `game_kpi` will be created on first produce. Pin to
      # `false` in prod.
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
    ports:
      - "127.0.0.1:9094:9094"
    expose:
      - "9092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      # kafka-topics.sh succeeds only once the broker has joined the
      # cluster; cheaper than producing a test message.
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  clickhouse:
    # The analytics warehouse — picks up events from the Kafka topics
    # via ClickHouse's built-in Kafka engine table, materialised into
    # MergeTree tables for cheap COUNT/AVG/percentile reads.
    image: clickhouse/clickhouse-server:25.3-alpine
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Single-node defaults; the official image creates the `default`
      # database + `default` user on first boot.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse-dev-pass}
    ports:
      # 8123 = HTTP interface (for ad-hoc curl-based queries);
      # 9000 conflicts with MinIO so we leave the native TCP protocol
      # on its docker-internal port only.
      - "127.0.0.1:8123:8123"
    expose:
      - "9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse-init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  cassandra-init:
    # One-shot keyspace + table bootstrap. The official cassandra image has
    # no /docker-entrypoint-initdb.d mechanism (that's Postgres-only), so we
    # run cqlsh against the live Cassandra container ourselves. Exits 0 once
    # the schema is in place; the api blocks on this via
    # condition: service_completed_successfully so it never starts before
    # the keyspace exists.
    image: cassandra:5
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-init.cql:/init.cql:ro
    entrypoint: ["sh", "-c", "cqlsh cassandra 9042 -f /init.cql && echo '✓ keyspace ready'"]
    restart: "no"

  api:
    image: snapdragon-games/bff:${SNAPDRAGON_TAG:-dev}
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    # No host port — the web nginx terminates on :8080 and proxies /api
    # to api:8080 internally. Keeping the api off the host avoids a port
    # conflict with the web port and matches a real prod topology.
    expose:
      - "8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: threewizards
      DB_USER: threewizards
      DB_PASS: threewizards
      CASDOOR_ENDPOINT: http://casdoor:8000
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-twclient001}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_ORGANIZATION: threewizards
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_KEYSPACE: threewizards
      CASSANDRA_LOCAL_DC: dc1
      SPRING_PROFILES_ACTIVE: prod
      # Hot-uploaded games land here; AssetController falls back to this
      # path when classpath assets/levels/<slug>/ doesn't have the file.
      # Override the host-side bind via APP_GAMES_UPLOAD_HOST_DIR (see
      # the volume entry below); the in-container path stays stable.
      APP_UPLOADS_GAMES_DIR: ${APP_UPLOADS_GAMES_DIR:-/var/snapdragon/games}

      # Multipart upload limits — game bundle zips can run into the
      # hundreds of megabytes. Override per environment if needed.
      APP_MAX_IN_MEMORY:    ${APP_MAX_IN_MEMORY:-1MB}
      APP_MAX_PART_SIZE:    ${APP_MAX_PART_SIZE:-1024MB}
      APP_MAX_PARTS:        ${APP_MAX_PARTS:-32}
      APP_CODEC_MAX:        ${APP_CODEC_MAX:-16MB}
    volumes:
      # Dev default: a Docker-managed named volume. Staging + prod
      # override this in their compose overlays with a bind mount
      # pointing at a real host path (NFS / fast SSD). Don't
      # duplicate-mount in a single file — Compose errors on the
      # second entry.
      - games_uploads:/var/snapdragon/games
    restart: on-failure

  frontend:
    image: snapdragon-games/portal-host:${SNAPDRAGON_TAG:-dev}
    build: ./frontend
    depends_on:
      # nginx resolves every upstream at startup; without these the
      # frontend dies on `host not found in upstream` for any federated
      # remote that hasn't booted yet. Must list every upstream that
      # appears in EITHER nginx.conf OR nginx-tls.conf — the e2e
      # overlay swaps the config but reuses this depends_on list, so
      # an upstream that's only referenced from one of the two files
      # still needs to be here.
      - api
      - login
      - registration
      - producer-registration
      - banned
      - admin
      - mod
      - publisher
      - api-docs
      - games-three-wizards
      - games-dodecahedron
      - games-rpg-maker
      - games-vn-maker
      - rpg-builder
      - vn-builder
      - wasm-fragment
    # Web is on :8080 across compose / dev / e2e. nginx serves the Angular
    # bundle and reverse-proxies /api/* to api:8080 internally.
    # Default bind: 127.0.0.1 only — flip to 0.0.0.0 for LAN access via
    # lan.properties. Two equivalent ways to take that knob:
    #   • `make lan-up`   (sources lan.properties, uses --env-file)
    #   • `docker compose --env-file lan.properties up -d` (plain)
    # The plain form works because lan.properties IS a docker-compose
    # env-file (FRONTEND_BIND=… etc. literal KEY=VALUE) — no Makefile
    # translation step in between, so no surprise default if you skip
    # the wrapper.
    ports:
       - "${FRONTEND_BIND:-127.0.0.1:}${FRONTEND_PORT:-8080}:8080"
  # ── Side services: builder back-ends ────────────────────────────────────────
  # rpg-builder stores Mudlet-shaped RPG project trees and produces
  # snapdragon-bridge Godot WASM bundles. vn-builder does the VN
  # equivalent (godot-2d-visual-novel-shaped). Each owns its own
  # Postgres DB; both POST built bundles to the BFF upload endpoint
  # so produced games federate under the building user. The host
  # nginx proxies /api/rpg/ and /api/vn/ to these services so the
  # federated maker remotes can talk to them via same-origin URLs.

  rpg-builder:
    image: snapdragon-games/rpg-builder:${SNAPDRAGON_TAG:-dev}
    build: ./rpg-builder
    depends_on:
      postgres-rpg-builder:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DB_HOST: postgres-rpg-builder
      DB_PORT: 5432
      DB_NAME: rpg_builder
      DB_USER: rpg_builder
      DB_PASS: rpg_builder
      CASDOOR_ENDPOINT: http://casdoor:8000
      APP_BFF_BASE_URL: http://api:8080
      APP_BUILD_GODOT_ENABLED: "false"
      APP_BUILD_WORKDIR: /var/snapdragon/rpg-builds
      APP_BUILD_ASSETS_DIR: /var/snapdragon/rpg-assets
    volumes:
      - rpg_builds:/var/snapdragon/rpg-builds
      - rpg_assets:/var/snapdragon/rpg-assets
    restart: on-failure

  vn-builder:
    image: snapdragon-games/vn-builder:${SNAPDRAGON_TAG:-dev}
    build: ./vn-builder
    depends_on:
      postgres-vn-builder:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DB_HOST: postgres-vn-builder
      DB_PORT: 5432
      DB_NAME: vn_builder
      DB_USER: vn_builder
      DB_PASS: vn_builder
      CASDOOR_ENDPOINT: http://casdoor:8000
      APP_BFF_BASE_URL: http://api:8080
      APP_BUILD_GODOT_ENABLED: "false"
      APP_BUILD_WORKDIR: /var/snapdragon/vn-builds
      APP_BUILD_ASSETS_DIR: /var/snapdragon/vn-assets
    volumes:
      - vn_builds:/var/snapdragon/vn-builds
      - vn_assets:/var/snapdragon/vn-assets
    restart: on-failure

  # ── Federation remotes ──────────────────────────────────────────────────────
  # Each `federation_modules` row points at one of these services. login,
  # admin, games-three-wizards, and games-dodecahedron are real Angular
  # remotes built with `@angular-architects/native-federation:build` and
  # served by nginx. wasm-fragment stays an nginx-only service (it's a
  # `fragment` kind that streams Godot bundles by `?slug=&level=` — no
  # Angular build needed).
  #
  # All four expose only on the compose network; the host shell (frontend
  # above) is the only public-facing service. The host's nginx proxies
  # /_remotes/<slug>/ → http://<slug>:8080/ so the browser sees a single
  # origin (same COOP/COEP, same TLS termination, no CORS gymnastics).

  login:
    image: snapdragon-games/login-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/login/Dockerfile
    expose: ["8080"]

  # Federated registration remote — handles external OAuth signup
  # (GitHub today). Mounted at /registration by the host shell;
  # gateway permits the /_remotes/registration/* path for
  # unauthenticated traffic. See decision item #5 in the platform
  # roadmap + 030-auth-ux-remotes-federation.xml seed row.
  registration:
    image: snapdragon-games/registration-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/registration/Dockerfile
    expose: ["8080"]

  # Federated producer-registration remote — application form for
  # players who want producer / mod authority. Submission lands in
  # `producer_contacts` (Liquibase 031) with status=PENDING; an
  # admin reviews + flips to APPROVED out of band. Roadmap item #8.
  producer-registration:
    image: snapdragon-games/producer-registration-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/producer-registration/Dockerfile
    expose: ["8080"]

  # Federated banned-user remote — the ONE route a revoked user
  # can reach besides /login + /registration. Mounted at /banned;
  # the host's auth-error interceptor routes 403 + X-Revoked
  # responses here. Roadmap item #7.
  banned:
    image: snapdragon-games/banned-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/banned/Dockerfile
    expose: ["8080"]

  admin:
    image: snapdragon-games/admin-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/admin/Dockerfile
    expose: ["8080"]

  # Per-game moderator console — list scoped games + open sessions, with
  # stop-session and per-player kick actions. Authz is BFF-side via
  # mod_game_scopes; this service just ships the UI.
  mod:
    image: snapdragon-games/mod-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/mod/Dockerfile
    expose: ["8080"]

  # Per-game publisher console — owned-games list + bundle upload form +
  # mod-grant card. Authz via publisher_game_scopes; the upload route
  # accepts ROLE_PUBLISHER as well as ROLE_ADMIN.
  publisher:
    image: snapdragon-games/publisher-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/publisher/Dockerfile
    expose: ["8080"]

  # Federated API docs explorer — a navigator-style swagger/javadoc
  # replacement generated from the BFF's OpenAPI spec. Mounted at
  # /admin/docs in the host. Same image pattern as login + admin.
  api-docs:
    image: snapdragon-games/api-docs-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/api-docs/Dockerfile
    expose: ["8080"]

  games-three-wizards:
    image: snapdragon-games/three-wizards-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/games-three-wizards/Dockerfile
    expose: ["8080"]

  games-dodecahedron:
    image: snapdragon-games/dodecahedron-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/games-dodecahedron/Dockerfile
    expose: ["8080"]

  # Mudlet-shaped RPG editor remote. Mounts at /rpg-maker on the host;
  # talks to the rpg-builder side service via /api/rpg/* (same-origin
  # through the host nginx proxy below).
  games-rpg-maker:
    image: snapdragon-games/rpg-maker-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/games-rpg-maker/Dockerfile
    expose: ["8080"]

  # godot-2d-visual-novel-shaped VN editor remote. Mounts at /vn-maker;
  # talks to the vn-builder side service via /api/vn/*.
  games-vn-maker:
    image: snapdragon-games/vn-maker-remote:${SNAPDRAGON_TAG:-dev}
    build:
      context: ./frontend
      dockerfile: projects/games-vn-maker/Dockerfile
    expose: ["8080"]

  # wasm-fragment is the shared asset-tier service: it serves the
  # Godot bundles (index.html / index.js / index.wasm / index.pck)
  # directly from its own nginx, taking the api service off the
  # binary asset path. Build context is the repo root so the
  # classpath bundles in backend/src/main/resources/assets/levels/
  # bake in at image build time. COOP/COEP set for SharedArrayBuffer
  # + threaded WASM; .wasm gets the right application/wasm MIME so
  # WebAssembly.instantiateStreaming doesn't fall back to ArrayBuffer.
  wasm-fragment:
    image: snapdragon-games/wasm-fragment:${SNAPDRAGON_TAG:-dev}
    build:
      context: .
      dockerfile: wasm-fragment/Dockerfile
    expose: ["8080"]

volumes:
  pgdata:
  pgdata_rpg_builder:
  pgdata_vn_builder:
  cassandra_data:
  games_uploads:
  rpg_builds:
  rpg_assets:
  vn_builds:
  vn_assets:
  kafka_data:
  clickhouse_data:
