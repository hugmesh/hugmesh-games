services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threewizards
      POSTGRES_USER: threewizards
      POSTGRES_PASSWORD: threewizards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threewizards"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: threewizards
      DB_USER: threewizards
      DB_PASS: threewizards
    restart: on-failure

volumes:
  pgdata:
