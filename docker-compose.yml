services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: threewizards
      POSTGRES_USER: threewizards
      POSTGRES_PASSWORD: threewizards
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threewizards"]
      interval: 5s
      timeout: 5s
      retries: 10

  casdoor:
    image: casbin/casdoor:latest
    entrypoint: ["/bin/sh", "/casdoor-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      # Set these explicitly to override generated random values.
      # Leave unset to get a secure random secret printed to container logs on first run.
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-twclient001}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_ADMIN_PASS: ${CASDOOR_ADMIN_PASS:-}
      CASDOOR_PLAYER_PASS: ${CASDOOR_PLAYER_PASS:-}
    volumes:
      - ./casdoor/conf:/conf
      - ./casdoor/init_data.json.tpl:/init_data.json.tpl
      - ./casdoor/entrypoint.sh:/casdoor-init.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  cassandra:
    # Cross-pod session/cache layer. The api uses it as a CQL-backed store of
    # active sessions / per-pod controller leases / aggregate stats so a
    # multi-pod deployment can answer admin-stream queries from any pod
    # without a fan-out to the others.
    image: cassandra:5
    environment:
      CASSANDRA_CLUSTER_NAME: ThreeWizardsCluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  cassandra-init:
    # One-shot keyspace + table bootstrap. The official cassandra image has
    # no /docker-entrypoint-initdb.d mechanism (that's Postgres-only), so we
    # run cqlsh against the live Cassandra container ourselves. Exits 0 once
    # the schema is in place; the api blocks on this via
    # condition: service_completed_successfully so it never starts before
    # the keyspace exists.
    image: cassandra:5
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-init.cql:/init.cql:ro
    entrypoint: ["sh", "-c", "cqlsh cassandra 9042 -f /init.cql && echo '✓ keyspace ready'"]
    restart: "no"

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      casdoor:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    # No host port — the web nginx terminates on :8080 and proxies /api
    # to api:8080 internally. Keeping the api off the host avoids a port
    # conflict with the web port and matches a real prod topology.
    expose:
      - "8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: threewizards
      DB_USER: threewizards
      DB_PASS: threewizards
      CASDOOR_ENDPOINT: http://casdoor:8000
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-twclient001}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_ORGANIZATION: threewizards
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_KEYSPACE: threewizards
      CASSANDRA_LOCAL_DC: dc1
      SPRING_PROFILES_ACTIVE: prod
      # Hot-uploaded games land here; AssetController falls back to this
      # path when classpath assets/levels/<slug>/ doesn't have the file.
      APP_UPLOADS_GAMES_DIR: /var/snapdragon/games
    volumes:
      - games_uploads:/var/snapdragon/games
    restart: on-failure

  frontend:
    build: ./frontend
    depends_on:
      # nginx resolves every upstream at startup; without these the
      # frontend dies on `host not found in upstream` for any federated
      # remote that hasn't booted yet.
      - api
      - login
      - admin
      - games-three-wizards
      - games-dodecahedron
      - wasm-fragment
    # Web is on :8080 across compose / dev / e2e. nginx serves the Angular
    # bundle and reverse-proxies /api/* to api:8080 internally.
    ports:
      - "8080:8080"

  # ── Federation remote stubs ─────────────────────────────────────────────────
  # Each `federation_modules` row points at one of these services. They
  # currently serve a 200 OK placeholder so the manifest URLs resolve and
  # the host federation runtime doesn't 404 during initFederation. Real
  # builds — separate Angular projects with their own
  # `@angular-architects/native-federation:build` config — replace these
  # in PLAN section A's full-split phase.
  #
  # Today these stubs are reachable on the compose network only; they're
  # not exposed on the host. The host shell (frontend service above) is
  # the only public-facing piece.

  login:
    image: nginx:1.27-alpine
    expose: ["8080"]
    volumes:
      - ./frontend/federation-stubs/login.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/federation-stubs/remote-stub.html:/usr/share/nginx/html/index.html:ro

  admin:
    image: nginx:1.27-alpine
    expose: ["8080"]
    volumes:
      - ./frontend/federation-stubs/admin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/federation-stubs/remote-stub.html:/usr/share/nginx/html/index.html:ro

  games-three-wizards:
    image: nginx:1.27-alpine
    expose: ["8080"]
    volumes:
      - ./frontend/federation-stubs/game.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/federation-stubs/remote-stub.html:/usr/share/nginx/html/index.html:ro

  # First fully-built federated remote. Real ng build + nginx-served
  # bundle; the host shell discovers it via /api/federation/manifest
  # and injects its main bundle at runtime when a player clicks the
  # Dodecahedron card. The other game-* services stay as stubs until
  # their per-project builds land.
  games-dodecahedron:
    build:
      context: ./frontend
      dockerfile: projects/games-dodecahedron/Dockerfile
    expose: ["8080"]

  wasm-fragment:
    image: nginx:1.27-alpine
    expose: ["8080"]
    volumes:
      - ./frontend/federation-stubs/wasm-fragment.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/federation-stubs/remote-stub.html:/usr/share/nginx/html/index.html:ro

volumes:
  pgdata:
  cassandra_data:
  games_uploads:
