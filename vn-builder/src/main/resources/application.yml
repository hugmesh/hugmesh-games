spring:
  application:
    name: hugmesh-vn-builder
  # DB_PASS has NO default (same rule as the backend BFF): a literal fallback
  # here was baked into the jar + image and was what every deployment that
  # did not set DB_PASS ran on, production included. docker-compose.yml
  # supplies it from VN_BUILDER_DB_PASS; an unset value now fails at connect
  # time instead of silently using a public password.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:postgres-vn-builder}:${DB_PORT:5432}/${DB_NAME:vn_builder}
    username: ${DB_USER:vn_builder}
    password: ${DB_PASS:}
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-vn-builder}:${DB_PORT:5432}/${DB_NAME:vn_builder}
    username: ${DB_USER:vn_builder}
    password: ${DB_PASS:}
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    url: jdbc:postgresql://${DB_HOST:postgres-vn-builder}:${DB_PORT:5432}/${DB_NAME:vn_builder}
    user: ${DB_USER:vn_builder}
    password: ${DB_PASS:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Match the BFF — jwk-set-uri only, no issuer-uri. See rpg-builder
          # application.yml for the rationale.
          jwk-set-uri: ${CASDOOR_ENDPOINT:http://casdoor:8000}/.well-known/jwks

server:
  port: 8080

app:
  bff:
    base-url: ${APP_BFF_BASE_URL:http://api:8080}
  build:
    tick: ${APP_BUILD_TICK:PT5S}
    # Real Godot Web export (GodotExporter) when true; dev stub bundles when
    # false (default). See rpg-builder application.yml for the full notes.
    godot-enabled: ${APP_BUILD_GODOT_ENABLED:false}
    godot-bin: ${APP_BUILD_GODOT_BIN:godot}
    godot-preset: ${APP_BUILD_GODOT_PRESET:Web}
    godot-timeout: ${APP_BUILD_GODOT_TIMEOUT:PT10M}
    # Compiled hugmesh-bridge binaries baked into each rendered project's
    # bin/ so the WASM carries the multiplayer HostBridge. Empty → skipped.
    bridge-dir: ${APP_BUILD_BRIDGE_DIR:}
    workdir: ${APP_BUILD_WORKDIR:/var/hugmesh/vn-builds}
    assets-dir: ${APP_BUILD_ASSETS_DIR:/var/hugmesh/vn-assets}
    max-bundle-bytes: ${APP_BUILD_MAX_BUNDLE_BYTES:209715200}

logging:
  level:
    games.hugmesh.vnbuilder: INFO
    org.springframework.r2dbc: WARN
