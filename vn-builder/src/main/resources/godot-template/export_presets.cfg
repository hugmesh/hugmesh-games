[preset.0]

name="Web"
platform="Web"
runnable=true
custom_features=""
export_filter="all_resources"
; Pack the raw non-resource sources the runtime reads via FileAccess:
; the per-act scenes_data.json AND the materialized background/portrait
; image bytes under res://assets/. Without these in the include_filter
; the .pck would only carry Godot-imported textures (loadable via
; ResourceLoader, not FileAccess), and scene_player.gd's buffer decoder
; would find nothing. Keeping the originals here means FileAccess reads
; the real bytes (import remapping only affects ResourceLoader).
include_filter="*.json,*.svg,*.png,*.jpg,*.jpeg,*.webp"
exclude_filter=""
export_path="../bundle/index.html"

[preset.0.options]

variant/extensions_support=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
