; Each preset below produces one per-level WASM bundle.
; New level? Add another preset with a unique [preset.N] index and point
; export_path at backend/src/main/resources/assets/levels/<slug>/index.html.
; Make sure main_scene inside project.godot is overridden per preset via
; 'export_filter' / custom features if you want level-specific scene filtering.

[preset.0]

name="Cave"
platform="Web"
runnable=true
dedicated_server=false
custom_features="level_cave"
export_filter="all_resources"
include_filter=""
exclude_filter="*.gdextension,scenes/field.tscn"
export_path="../../backend/src/main/resources/assets/levels/cave/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

[preset.1]

name="Field"
platform="Web"
runnable=true
dedicated_server=false
custom_features="level_field"
export_filter="all_resources"
include_filter=""
exclude_filter="*.gdextension,scenes/cave.tscn"
export_path="../../backend/src/main/resources/assets/levels/field/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
